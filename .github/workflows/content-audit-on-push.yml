name: Content Audit on Push

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '!index.html'
      - '!articles.html'
      - '!preview-layout.html'
      - '!agent-architecture.html'
      - '!dashboard_preview.html'
  workflow_dispatch:  # Allow manual trigger

jobs:
  content-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need HEAD~1 for --changed mode

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run content audit on changed files
        id: audit
        run: |
          python scripts/content-audit-auto.py --changed 2>&1 | tee /tmp/audit-output.txt
          if grep -q "issue" /tmp/audit-output.txt; then
            echo "has_issues=true" >> $GITHUB_OUTPUT
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
          fi

      - name: Route event via event-router
        if: steps.audit.outputs.has_issues == 'true'
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- '*.html' | head -5 | tr '\n' ', ')
          python scripts/event-router.py --repo --event new_article --target "$CHANGED"

      - name: Track outcomes (L5)
        if: always()
        run: |
          REPORT=$(ls -t memory/content-audit-*.md 2>/dev/null | head -1)
          if [ -n "$REPORT" ]; then
            python scripts/outcome-tracker.py --source content-audit --report "$REPORT"
          fi

      - name: Commit audit report if issues found
        if: steps.audit.outputs.has_issues == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memory/content-audit-*.md memory/outbox-events.md memory/outcomes.json
          git diff --staged --quiet || (git commit -m "content-audit: issues detected $(date +%Y-%m-%d)" && git push)

      - name: Clean pass
        if: steps.audit.outputs.has_issues == 'false'
        run: echo "✅ All changed articles pass audit — no action needed"
