name: Weekly Health Check

on:
  schedule:
    - cron: '0 14 * * 0'  # Every Sunday at 9 AM EST (14:00 UTC)
  workflow_dispatch:  # Allow manual trigger

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run health check
        id: healthcheck
        run: |
          python scripts/health-check-auto.py --repo 2>&1 | tee /tmp/health-output.txt
          if grep -q "ISSUES FOUND" /tmp/health-output.txt; then
            echo "has_issues=true" >> $GITHUB_OUTPUT
          elif grep -q "AUTO-FIXED" /tmp/health-output.txt; then
            echo "has_issues=false" >> $GITHUB_OUTPUT
            echo "self_healed=true" >> $GITHUB_OUTPUT
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
            echo "self_healed=false" >> $GITHUB_OUTPUT
            echo "All healthy - no action needed"
          fi

      - name: Route health_fail event
        if: steps.healthcheck.outputs.has_issues == 'true'
        run: |
          SUMMARY=$(grep -E "^- " /tmp/health-output.txt | head -5 | tr '\n' '; ')
          python scripts/event-router.py --repo --event health_fail --detail "$SUMMARY"

      - name: Route self-heal event
        if: steps.healthcheck.outputs.self_healed == 'true'
        run: |
          HEALED=$(grep "AUTO-FIXED" /tmp/health-output.txt | wc -l)
          python scripts/event-router.py --repo --event push_success --detail "Health check self-healed $HEALED issue(s)"

      - name: Track outcomes (L5)
        if: always()
        run: |
          REPORT=$(ls -t memory/health-check-auto-*.md memory/health-report-*.md 2>/dev/null | head -1)
          if [ -n "$REPORT" ]; then
            python scripts/outcome-tracker.py --source health-check --report "$REPORT"
          fi

      - name: Check rule proposals (L5)
        run: |
          python scripts/rule-proposer.py --check
          python scripts/rule-proposer.py

      - name: Commit changes
        if: steps.healthcheck.outputs.has_issues == 'true' || steps.healthcheck.outputs.self_healed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add memory/ CLAUDE.md QUICK_CONTEXT.md
          git diff --staged --quiet || (git commit -m "health-check: $(date +%Y-%m-%d) [auto]" && git push)
