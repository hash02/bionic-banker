<svg xmlns="http://www.w3.org/2000/svg" width="2160" height="2700" viewBox="0 0 2160 2700">
<rect width="2160" height="2700" fill="#050807"/>
<defs>
  <linearGradient id="panel" x1="0" x2="1"><stop offset="0" stop-color="#07130d"/><stop offset="1" stop-color="#0d2116"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<path d="M0 160H2160M0 360H2160M0 560H2160M0 760H2160M0 960H2160M0 1160H2160M0 1360H2160M0 1560H2160M0 1760H2160M0 1960H2160M0 2160H2160M0 2360H2160M180 0V2700M440 0V2700M700 0V2700M960 0V2700M1220 0V2700M1480 0V2700M1740 0V2700M2000 0V2700" stroke="#123d2a" stroke-width="1" opacity=".45"/>
<text x="130" y="150" font-family="Inter, Arial, sans-serif" font-size="42" letter-spacing="16" fill="#7cffb6">BIONIC BANKER / CONTROL LAYER</text>
<text x="130" y="290" font-family="Inter, Arial, sans-serif" font-size="112" font-weight="900" fill="#f4fff8">AI answer is</text>
<text x="130" y="420" font-family="Inter, Arial, sans-serif" font-size="112" font-weight="900" fill="#f4fff8">not evidence.</text>
<text x="132" y="520" font-family="Inter, Arial, sans-serif" font-size="48" fill="#b8ffd9">Before finance teams rely on AI, turn claims</text>
<text x="132" y="584" font-family="Inter, Arial, sans-serif" font-size="48" fill="#b8ffd9">into reviewable proof.</text>

<rect x="130" y="750" width="720" height="360" rx="34" fill="url(#panel)" stroke="#245c3e" stroke-width="2"/>
<text x="180" y="835" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="900" fill="#ffffff">AI OUTPUT</text>
<text x="180" y="930" font-family="Inter, Arial, sans-serif" font-size="42" fill="#d7ffe8">Confident summary</text>
<text x="180" y="1010" font-family="Inter, Arial, sans-serif" font-size="42" fill="#d7ffe8">Risk explanation</text>
<text x="180" y="1090" font-family="Inter, Arial, sans-serif" font-size="42" fill="#d7ffe8">Policy interpretation</text>

<path d="M900 930H1090" stroke="#00ff88" stroke-width="10" filter="url(#glow)"/><path d="M1090 930l-45-30v60z" fill="#00ff88"/>

<rect x="1150" y="690" width="780" height="500" rx="42" fill="#030604" stroke="#00ff88" stroke-width="4" filter="url(#glow)"/>
<text x="1225" y="785" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="900" fill="#ffffff">REVIEW GATES</text>
<text x="1225" y="900" font-family="Inter, Arial, sans-serif" font-size="46" fill="#f4fff8">1. Exact claim</text>
<text x="1225" y="985" font-family="Inter, Arial, sans-serif" font-size="46" fill="#f4fff8">2. Source trail</text>
<text x="1225" y="1070" font-family="Inter, Arial, sans-serif" font-size="46" fill="#f4fff8">3. Current + relevant</text>
<text x="1225" y="1155" font-family="Inter, Arial, sans-serif" font-size="46" fill="#f4fff8">4. Falsifier</text>

<rect x="130" y="1350" width="1900" height="470" rx="38" fill="#07130d" stroke="#245c3e" stroke-width="2"/>
<text x="180" y="1445" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="900" fill="#00ff88">Evidence packet</text>
<text x="180" y="1545" font-family="Inter, Arial, sans-serif" font-size="44" fill="#f4fff8">sources checked</text>
<text x="180" y="1630" font-family="Inter, Arial, sans-serif" font-size="44" fill="#f4fff8">reviewer decision</text>
<text x="180" y="1715" font-family="Inter, Arial, sans-serif" font-size="44" fill="#f4fff8">saved audit trail</text>
<text x="900" y="1545" font-family="Inter, Arial, sans-serif" font-size="44" fill="#f4fff8">who approved?</text>
<text x="900" y="1630" font-family="Inter, Arial, sans-serif" font-size="44" fill="#f4fff8">what action follows?</text>
<text x="900" y="1715" font-family="Inter, Arial, sans-serif" font-size="44" fill="#f4fff8">what proves it false?</text>

<rect x="130" y="1980" width="1900" height="250" rx="34" fill="#0b1711" stroke="#183f2b"/>
<text x="180" y="2070" font-family="Inter, Arial, sans-serif" font-size="52" font-weight="900" fill="#00ff88">Checklist:</text>
<text x="180" y="2150" font-family="Inter, Arial, sans-serif" font-size="48" fill="#f4fff8">claim → source → freshness → relevance</text>
<text x="180" y="2225" font-family="Inter, Arial, sans-serif" font-size="48" fill="#f4fff8">→ falsifier → reviewer → trail</text>

<rect x="130" y="2380" width="1900" height="160" rx="28" fill="#07100b" stroke="#17452e"/>
<text x="180" y="2475" font-family="Inter, Arial, sans-serif" font-size="42" fill="#b8ffd9">The AI can help draft the narrative.</text>
<text x="180" y="2535" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff">It should not silently become the evidence.</text>
</svg>
