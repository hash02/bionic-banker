<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAYA Command Center — Bionic Banker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #08080e;
    --bg-card: #0f1018;
    --bg-card-hover: #14151f;
    --border: #1a1b2e;
    --text: #e4e4ec;
    --text-dim: #8888a0;
    --accent: #5b73f8;
    --accent2: #8b6cf7;
    --green: #1fa068;
    --green-dim: rgba(31, 160, 104, 0.15);
    --red: #ff4444;
    --red-dim: rgba(255, 68, 68, 0.15);
    --yellow: #f0b429;
    --yellow-dim: rgba(240, 180, 41, 0.15);
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── GRID LAYOUT (75" TV optimized) ── */
  .dashboard {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    grid-template-rows: auto 1fr 1fr 1fr;
    gap: 12px;
    padding: 16px;
    height: 100vh;
    width: 100vw;
  }

  /* ── HEADER BAR ── */
  .header {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .header-brand h1 {
    font-size: 1.4rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }

  .header-brand .subtitle {
    font-size: 0.75rem;
    color: var(--text-dim);
    font-weight: 400;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .header-status {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 0.8rem;
    color: var(--text-dim);
  }

  .pulse-dot {
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
    animation: pulse 2s infinite;
    display: inline-block;
    margin-right: 6px;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(31, 160, 104, 0.7); }
    50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(31, 160, 104, 0); }
  }

  .clock {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    font-weight: 600;
    color: var(--text);
  }

  /* ── CARDS ── */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .card:hover { border-color: var(--accent); }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    flex-shrink: 0;
  }

  .card-title {
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-dim);
  }

  .card-badge {
    font-size: 0.6rem;
    padding: 2px 8px;
    border-radius: 100px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .badge-live { background: var(--green-dim); color: var(--green); }
  .badge-warn { background: var(--yellow-dim); color: var(--yellow); }

  /* ── BTC HERO CARD ── */
  .btc-hero {
    grid-column: 1 / 3;
    grid-row: 2;
  }

  .btc-price-row {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 8px;
  }

  .btc-price {
    font-family: 'JetBrains Mono', monospace;
    font-size: 3.2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1;
  }

  .btc-change {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.2rem;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 8px;
  }

  .change-up { color: var(--green); background: var(--green-dim); }
  .change-down { color: var(--red); background: var(--red-dim); }

  .btc-meta {
    display: flex;
    gap: 24px;
    margin-top: 8px;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .btc-meta span { font-family: 'JetBrains Mono', monospace; }
  .btc-meta .label { font-family: 'Inter', sans-serif; margin-right: 4px; }

  .sparkline-container {
    flex: 1;
    margin-top: 12px;
    min-height: 0;
  }

  .sparkline-container canvas {
    width: 100%;
    height: 100%;
  }

  /* ── ALTCOINS ── */
  .altcoins { grid-column: 3 / 5; grid-row: 2; }

  .coin-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    flex: 1;
  }

  .coin-item {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .coin-name {
    font-size: 0.7rem;
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .coin-price {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.4rem;
    font-weight: 700;
  }

  .coin-change {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8rem;
    font-weight: 600;
  }

  .coin-mcap {
    font-size: 0.65rem;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── GLOBAL MARKET ── */
  .market-overview {
    grid-column: 1 / 3;
    grid-row: 3;
  }

  .market-stats {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    flex: 1;
  }

  .market-stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .stat-label {
    font-size: 0.65rem;
    color: var(--text-dim);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.3rem;
    font-weight: 700;
  }

  .stat-sub {
    font-size: 0.65rem;
    color: var(--text-dim);
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── TRENDING ── */
  .trending { grid-column: 3 / 5; grid-row: 3; }

  .trend-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    overflow: hidden;
  }

  .trend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.8rem;
  }

  .trend-rank {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    color: var(--accent);
    min-width: 24px;
  }

  .trend-name { font-weight: 600; flex: 1; }
  .trend-symbol { color: var(--text-dim); font-size: 0.7rem; }

  .trend-price {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 0.8rem;
  }

  .trend-change-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    font-weight: 600;
    min-width: 60px;
    text-align: right;
  }

  /* ── NEWS / FEED ── */
  .news-feed {
    grid-column: 1 / 3;
    grid-row: 4;
  }

  .news-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    overflow: hidden;
  }

  .news-item {
    display: flex;
    gap: 12px;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    align-items: flex-start;
  }

  .news-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--accent);
    min-width: 50px;
    flex-shrink: 0;
    padding-top: 2px;
  }

  .news-title {
    font-size: 0.8rem;
    font-weight: 500;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .news-source {
    font-size: 0.6rem;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* ── BIONIC BANKER STATS ── */
  .site-stats {
    grid-column: 3 / 5;
    grid-row: 4;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    flex: 1;
  }

  .site-stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }

  .site-stat-icon {
    font-size: 1.5rem;
    margin-bottom: 6px;
  }

  .site-stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.8rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .site-stat-label {
    font-size: 0.65rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 4px;
  }

  .site-stat-sub {
    font-size: 0.6rem;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    margin-top: 2px;
  }

  /* ── REFRESH INDICATOR ── */
  .refresh-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 1s linear;
    z-index: 100;
  }

  /* ── FEAR/GREED GAUGE ── */
  .gauge-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }

  .gauge-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 2.5rem;
    font-weight: 800;
    line-height: 1;
  }

  .gauge-label {
    font-size: 0.8rem;
    font-weight: 600;
    margin-top: 6px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .gauge-sublabel {
    font-size: 0.6rem;
    color: var(--text-dim);
    margin-top: 2px;
  }

  /* ── LOADING STATE ── */
  .skeleton {
    background: linear-gradient(90deg, var(--bg) 25%, var(--bg-card-hover) 50%, var(--bg) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 6px;
  }

  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* ── SCROLLING TICKER ── */
  .ticker-wrap {
    grid-column: 1 / -1;
    overflow: hidden;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 0;
    white-space: nowrap;
  }

  .ticker {
    display: inline-block;
    animation: scroll-left 60s linear infinite;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-dim);
  }

  .ticker span {
    margin-right: 40px;
  }

  .ticker .up { color: var(--green); }
  .ticker .down { color: var(--red); }
  .ticker .coin-label { color: var(--text); font-weight: 600; }

  @keyframes scroll-left {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
</style>
</head>
<body>

<div class="dashboard">
  <!-- HEADER -->
  <div class="header">
    <div class="header-brand">
      <h1>MAYA COMMAND CENTER</h1>
      <span class="subtitle">Bionic Banker — Mission Control</span>
    </div>
    <div class="header-status">
      <span><span class="pulse-dot"></span>SYSTEMS ONLINE</span>
      <span id="last-refresh">Refreshing...</span>
      <span class="clock" id="clock">--:--:--</span>
    </div>
  </div>

  <!-- BTC HERO -->
  <div class="card btc-hero">
    <div class="card-header">
      <span class="card-title">Bitcoin — BTC/USD</span>
      <span class="card-badge badge-live">LIVE</span>
    </div>
    <div class="btc-price-row">
      <span class="btc-price" id="btc-price">$--,---</span>
      <span class="btc-change" id="btc-change">--%</span>
    </div>
    <div class="btc-meta">
      <span><span class="label">MCap</span> <span id="btc-mcap">--</span></span>
      <span><span class="label">Vol 24h</span> <span id="btc-vol">--</span></span>
      <span><span class="label">ATH</span> <span id="btc-ath">--</span></span>
      <span><span class="label">Dominance</span> <span id="btc-dom">--</span></span>
    </div>
    <div class="sparkline-container">
      <canvas id="btc-sparkline"></canvas>
    </div>
  </div>

  <!-- ALTCOINS -->
  <div class="card altcoins">
    <div class="card-header">
      <span class="card-title">Top Assets</span>
      <span class="card-badge badge-live">LIVE</span>
    </div>
    <div class="coin-grid" id="coin-grid">
      <!-- filled by JS -->
    </div>
  </div>

  <!-- GLOBAL MARKET -->
  <div class="card market-overview">
    <div class="card-header">
      <span class="card-title">Global Market</span>
      <span class="card-badge badge-live">LIVE</span>
    </div>
    <div class="market-stats" id="market-stats">
      <!-- filled by JS -->
    </div>
  </div>

  <!-- TRENDING -->
  <div class="card trending">
    <div class="card-header">
      <span class="card-title">Trending</span>
      <span class="card-badge badge-live">LIVE</span>
    </div>
    <div class="trend-list" id="trend-list">
      <!-- filled by JS -->
    </div>
  </div>

  <!-- NEWS -->
  <div class="card news-feed">
    <div class="card-header">
      <span class="card-title">Crypto News Feed</span>
      <span class="card-badge badge-live">LIVE</span>
    </div>
    <div class="news-list" id="news-list">
      <!-- filled by JS -->
    </div>
  </div>

  <!-- SITE STATS + FEAR/GREED -->
  <div class="card site-stats">
    <div class="card-header">
      <span class="card-title">Bionic Banker — Dashboard</span>
      <span class="card-badge badge-live">28 ARTICLES</span>
    </div>
    <div class="stats-grid" id="stats-grid">
      <!-- filled by JS -->
    </div>
  </div>
</div>

<div class="refresh-bar" id="refresh-bar" style="width:0%"></div>

<script>
// ── CONFIG ──
const REFRESH_INTERVAL = 120000; // 2 min
const COINS = ['bitcoin','ethereum','solana','cardano','chainlink','avalanche-2'];
const COIN_SYMBOLS = { bitcoin:'BTC', ethereum:'ETH', solana:'SOL', cardano:'ADA', chainlink:'LINK', 'avalanche-2':'AVAX' };

// ── UTILS ──
function fmt(n, decimals=2) {
  if (n == null) return '--';
  if (n >= 1e12) return '$' + (n/1e12).toFixed(2) + 'T';
  if (n >= 1e9) return '$' + (n/1e9).toFixed(2) + 'B';
  if (n >= 1e6) return '$' + (n/1e6).toFixed(1) + 'M';
  if (n >= 1e3) return '$' + n.toLocaleString('en-US', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
  return '$' + n.toFixed(decimals);
}

function fmtPct(n) {
  if (n == null) return '--%';
  const sign = n >= 0 ? '+' : '';
  return sign + n.toFixed(2) + '%';
}

function changeClass(n) { return n >= 0 ? 'change-up' : 'change-down'; }
function changeColor(n) { return n >= 0 ? 'var(--green)' : 'var(--red)'; }

function timeAgo(ts) {
  const diff = Math.floor((Date.now() - ts * 1000) / 60000);
  if (diff < 1) return 'now';
  if (diff < 60) return diff + 'm';
  if (diff < 1440) return Math.floor(diff/60) + 'h';
  return Math.floor(diff/1440) + 'd';
}

// ── CLOCK ──
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour12: false });
}
setInterval(updateClock, 1000);
updateClock();

// ── SPARKLINE ──
function drawSparkline(canvasId, data, color = '#1fa068') {
  const canvas = document.getElementById(canvasId);
  if (!canvas || !data || data.length < 2) return;
  const ctx = canvas.getContext('2d');
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.scale(2, 2);

  const w = rect.width, h = rect.height;
  const min = Math.min(...data);
  const max = Math.max(...data);
  const range = max - min || 1;
  const pad = 4;

  // gradient fill
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color + '30');
  grad.addColorStop(1, color + '00');

  ctx.clearRect(0, 0, w, h);

  // line
  ctx.beginPath();
  data.forEach((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = pad + ((max - v) / range) * (h - pad * 2);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  // fill
  const lastX = w;
  const firstX = 0;
  ctx.lineTo(lastX, h);
  ctx.lineTo(firstX, h);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // current price dot
  const lastY = pad + ((max - data[data.length-1]) / range) * (h - pad * 2);
  ctx.beginPath();
  ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(lastX, lastY, 6, 0, Math.PI * 2);
  ctx.strokeStyle = color + '60';
  ctx.lineWidth = 2;
  ctx.stroke();
}

// ── FETCH CRYPTO DATA ──
async function fetchCryptoData() {
  try {
    // BTC detailed
    const btcRes = await fetch('https://api.coingecko.com/api/v3/coins/bitcoin?localization=false&tickers=false&community_data=false&developer_data=false&sparkline=true');
    const btc = await btcRes.json();
    const md = btc.market_data;

    document.getElementById('btc-price').textContent = fmt(md.current_price.usd, 0);
    const ch = md.price_change_percentage_24h;
    const chEl = document.getElementById('btc-change');
    chEl.textContent = fmtPct(ch);
    chEl.className = 'btc-change ' + changeClass(ch);
    document.getElementById('btc-mcap').textContent = fmt(md.market_cap.usd);
    document.getElementById('btc-vol').textContent = fmt(md.total_volume.usd);
    document.getElementById('btc-ath').textContent = fmt(md.ath.usd, 0);

    // sparkline
    if (md.sparkline_7d && md.sparkline_7d.price) {
      drawSparkline('btc-sparkline', md.sparkline_7d.price, ch >= 0 ? '#1fa068' : '#ff4444');
    }

    // Altcoins
    const altsRes = await fetch(`https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=${COINS.slice(1).join(',')}&order=market_cap_desc&sparkline=false&price_change_percentage=24h`);
    const alts = await altsRes.json();
    const coinGrid = document.getElementById('coin-grid');
    coinGrid.innerHTML = alts.map(c => `
      <div class="coin-item">
        <span class="coin-name">${(COIN_SYMBOLS[c.id] || c.symbol.toUpperCase())}</span>
        <span class="coin-price" style="color:${changeColor(c.price_change_percentage_24h)}">${fmt(c.current_price, c.current_price < 1 ? 4 : 2)}</span>
        <span class="coin-change" style="color:${changeColor(c.price_change_percentage_24h)}">${fmtPct(c.price_change_percentage_24h)}</span>
        <span class="coin-mcap">MCap ${fmt(c.market_cap)}</span>
      </div>
    `).join('');

    // Global
    const globalRes = await fetch('https://api.coingecko.com/api/v3/global');
    const global = await globalRes.json();
    const gd = global.data;
    document.getElementById('btc-dom').textContent = gd.market_cap_percentage.btc.toFixed(1) + '%';

    document.getElementById('market-stats').innerHTML = `
      <div class="market-stat">
        <div class="stat-label">Total Market Cap</div>
        <div class="stat-value">${fmt(gd.total_market_cap.usd)}</div>
        <div class="stat-sub">${fmtPct(gd.market_cap_change_percentage_24h_usd)} 24h</div>
      </div>
      <div class="market-stat">
        <div class="stat-label">24h Volume</div>
        <div class="stat-value">${fmt(gd.total_volume.usd)}</div>
        <div class="stat-sub">${gd.active_cryptocurrencies.toLocaleString()} active coins</div>
      </div>
      <div class="market-stat">
        <div class="stat-label">BTC Dominance</div>
        <div class="stat-value">${gd.market_cap_percentage.btc.toFixed(1)}%</div>
        <div class="stat-sub">ETH ${gd.market_cap_percentage.eth.toFixed(1)}%</div>
      </div>
      <div class="market-stat">
        <div class="stat-label">Fear & Greed</div>
        <div class="gauge-container" id="fear-greed">
          <div class="stat-value" style="font-size:1.1rem; color:var(--text-dim)">Loading...</div>
        </div>
      </div>
      <div class="market-stat">
        <div class="stat-label">Markets</div>
        <div class="stat-value">${gd.markets.toLocaleString()}</div>
        <div class="stat-sub">exchanges tracked</div>
      </div>
      <div class="market-stat">
        <div class="stat-label">DeFi Market Cap</div>
        <div class="stat-value">${fmt(gd.total_market_cap.usd * 0.045)}</div>
        <div class="stat-sub">~4.5% of total</div>
      </div>
    `;

    // Fear & Greed
    try {
      const fgRes = await fetch('https://api.alternative.me/fng/?limit=1');
      const fg = await fgRes.json();
      if (fg.data && fg.data[0]) {
        const val = parseInt(fg.data[0].value);
        const label = fg.data[0].value_classification;
        let color = val <= 25 ? 'var(--red)' : val <= 45 ? '#ff8c00' : val <= 55 ? 'var(--yellow)' : val <= 75 ? 'var(--green)' : '#00ff88';
        document.getElementById('fear-greed').innerHTML = `
          <div class="gauge-value" style="color:${color}">${val}</div>
          <div class="gauge-label" style="color:${color}">${label}</div>
        `;
      }
    } catch(e) {}

    // Trending
    const trendRes = await fetch('https://api.coingecko.com/api/v3/search/trending');
    const trend = await trendRes.json();
    const trendList = document.getElementById('trend-list');
    trendList.innerHTML = (trend.coins || []).slice(0, 7).map((c, i) => {
      const item = c.item;
      const price = item.data && item.data.price ? parseFloat(item.data.price) : null;
      const ch24 = item.data && item.data.price_change_percentage_24h ? item.data.price_change_percentage_24h.usd : null;
      return `
        <div class="trend-item">
          <span class="trend-rank">#${i+1}</span>
          <span class="trend-name">${item.name} <span class="trend-symbol">${item.symbol}</span></span>
          <span class="trend-price">${price ? (price < 0.01 ? '$' + price.toFixed(6) : fmt(price)) : '--'}</span>
          <span class="trend-change-val" style="color:${changeColor(ch24)}">${ch24 != null ? fmtPct(ch24) : '--'}</span>
        </div>
      `;
    }).join('');

  } catch(err) {
    console.error('Crypto fetch error:', err);
  }
}

// ── FETCH NEWS ──
async function fetchNews() {
  try {
    // Use CoinGecko status updates as a news proxy, or CryptoCompare
    const res = await fetch('https://min-api.cryptocompare.com/data/v2/news/?lang=EN&categories=BTC,ETH,regulation,DeFi&excludeCategories=Sponsored');
    const data = await res.json();
    const newsList = document.getElementById('news-list');
    if (data.Data && data.Data.length > 0) {
      newsList.innerHTML = data.Data.slice(0, 5).map(n => `
        <div class="news-item">
          <span class="news-time">${timeAgo(n.published_on)}</span>
          <div>
            <div class="news-title">${n.title}</div>
            <div class="news-source">${n.source}</div>
          </div>
        </div>
      `).join('');
    } else {
      // fallback: static status
      newsList.innerHTML = `<div class="news-item"><span class="news-time">--</span><div><div class="news-title">News feed loading... CryptoCompare API</div></div></div>`;
    }
  } catch(err) {
    console.error('News fetch error:', err);
    // Minimal fallback
    document.getElementById('news-list').innerHTML = `
      <div class="news-item"><span class="news-time">--</span><div><div class="news-title">News feed offline — check connection</div></div></div>
    `;
  }
}

// ── REFRESH CYCLE ──
let refreshTimer = 0;
function startRefreshBar() {
  refreshTimer = 0;
  const bar = document.getElementById('refresh-bar');
  bar.style.transition = 'none';
  bar.style.width = '0%';
  setTimeout(() => {
    bar.style.transition = `width ${REFRESH_INTERVAL/1000}s linear`;
    bar.style.width = '100%';
  }, 50);
}

async function refreshAll() {
  const start = Date.now();
  await Promise.all([fetchCryptoData(), fetchNews()]);
  updateSiteStats();
  const elapsed = Date.now() - start;
  document.getElementById('last-refresh').textContent = `Updated ${new Date().toLocaleTimeString('en-US', {hour12: false})} (${elapsed}ms)`;
  startRefreshBar();
}

// ── INIT ──
refreshAll();
setInterval(refreshAll, REFRESH_INTERVAL);

// Redraw sparkline on resize
window.addEventListener('resize', () => {
  // Re-fetch will redraw
});
</script>
