<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Five-layer private stablecoin settlement control map</title>
  <desc id="desc">A Bionic Banker visual showing participant records, privacy boundaries, compliance checks, reconciliation, surviving records, and human review for private stablecoin settlement.</desc>
  <rect width="1200" height="675" fill="#050805"/>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102016"/>
      <stop offset="1" stop-color="#071009"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16351f" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1200" height="675" fill="url(#grid)" opacity="0.7"/>
  <rect x="56" y="48" width="1088" height="579" rx="28" fill="url(#panel)" stroke="#2fbf63" stroke-width="2" opacity="0.96"/>

  <text x="96" y="112" fill="#f4fff7" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="800">Private settlement needs a control map</text>
  <text x="96" y="151" fill="#b9d8c0" font-family="Inter, Arial, sans-serif" font-size="20">Faster stablecoin rails still need records a human reviewer can inspect.</text>

  <g transform="translate(96 210)">
    <rect x="0" y="0" width="200" height="285" rx="18" fill="#08130b" stroke="#3ce177" stroke-width="2"/>
    <text x="26" y="46" fill="#3ce177" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">1. Participants</text>
    <text x="26" y="84" fill="#e9fff0" font-family="Inter, Arial, sans-serif" font-size="16">Who initiates?</text>
    <text x="26" y="113" fill="#e9fff0" font-family="Inter, Arial, sans-serif" font-size="16">Who approves?</text>
    <text x="26" y="142" fill="#e9fff0" font-family="Inter, Arial, sans-serif" font-size="16">Who investigates?</text>
    <circle cx="100" cy="223" r="34" fill="#102a16" stroke="#3ce177" stroke-width="2"/>
    <path d="M84 224 l14 14 30 -38" fill="none" stroke="#f4fff7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(304 210)">
    <rect x="0" y="0" width="200" height="285" rx="18" fill="#08130b" stroke="#2fbf63" stroke-width="2"/>
    <text x="26" y="46" fill="#3ce177" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">2. Privacy</text>
    <text x="26" y="84" fill="#e9fff0" font-family="Inter, Arial, sans-serif" font-size="16">Hidden from whom?</text>
    <text x="26" y="113" fill="#e9fff0" font-family="Inter, Arial, sans-serif" font-size="16">Visible to whom?</text>
    <text x="26" y="142" fill="#e9fff0" font-family="Inter, Arial, sans-serif" font-size="16">Reviewable when?</text>
    <path d="M68 212 c0 -36 64 -36 64 0 v16 h-64z" fill="none" stroke="#3ce177" stroke-width="5"/>
    <rect x="58" y="225" width="84" height="52" rx="10" fill="#102a16" stroke="#3ce177" stroke-width="2"/>
  </g>

  <g transform="translate(512 210)">
    <rect x="0" y="0" width="200" height="285" rx="18" fill="#08130b" stroke="#2fbf63" stroke-width="2"/>
    <text x="26" y="46" fill="#3ce177" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">3. Checks</text>
    <text x="26" y="84" fill="#e9fff0" font-family="Inter, Arial, sans-serif" font-size="16">Before payment</text>
    <text x="26" y="113" fill="#e9fff0" font-family="Inter, Arial, sans-serif" font-size="16">During settlement</text>
    <text x="26" y="142" fill="#e9fff0" font-family="Inter, Arial, sans-serif" font-size="16">After exceptions</text>
    <path d="M62 222 h76 M62 250 h76 M62 278 h76" stroke="#3ce177" stroke-width="5" stroke-linecap="round"/>
    <circle cx="42" cy="222" r="8" fill="#3ce177"/><circle cx="42" cy="250" r="8" fill="#3ce177"/><circle cx="42" cy="278" r="8" fill="#3ce177"/>
  </g>

  <g transform="translate(720 210)">
    <rect x="0" y="0" width="200" height="285" rx="18" fill="#08130b" stroke="#2fbf63" stroke-width="2"/>
    <text x="26" y="46" fill="#3ce177" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">4. Reconcile</text>
    <text x="26" y="84" fill="#e9fff0" font-family="Inter, Arial, sans-serif" font-size="16">Instruction</text>
    <text x="26" y="113" fill="#e9fff0" font-family="Inter, Arial, sans-serif" font-size="16">Settlement</text>
    <text x="26" y="142" fill="#e9fff0" font-family="Inter, Arial, sans-serif" font-size="16">Balance change</text>
    <path d="M55 226 h90 M55 258 h90" stroke="#3ce177" stroke-width="5" stroke-linecap="round"/>
    <path d="M72 210 l-17 16 17 16 M128 242 l17 16 -17 16" fill="none" stroke="#f4fff7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(928 210)">
    <rect x="0" y="0" width="200" height="285" rx="18" fill="#08130b" stroke="#3ce177" stroke-width="2"/>
    <text x="26" y="46" fill="#3ce177" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="800">5. Records</text>
    <text x="26" y="84" fill="#e9fff0" font-family="Inter, Arial, sans-serif" font-size="16">What survives?</text>
    <text x="26" y="113" fill="#e9fff0" font-family="Inter, Arial, sans-serif" font-size="16">Who can inspect?</text>
    <text x="26" y="142" fill="#e9fff0" font-family="Inter, Arial, sans-serif" font-size="16">What is missing?</text>
    <rect x="55" y="206" width="90" height="72" rx="10" fill="#102a16" stroke="#3ce177" stroke-width="2"/>
    <path d="M72 228 h56 M72 248 h42 M72 268 h50" stroke="#f4fff7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <path d="M210 535 H990" stroke="#3ce177" stroke-width="4" stroke-linecap="round" opacity="0.8" filter="url(#softGlow)"/>
  <path d="M990 535 l-20 -14 M990 535 l-20 14" stroke="#3ce177" stroke-width="4" stroke-linecap="round"/>
  <text x="96" y="571" fill="#f4fff7" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Source trail -> checked fact -> missing context -> clear limit -> human review</text>
  <text x="96" y="604" fill="#b9d8c0" font-family="Inter, Arial, sans-serif" font-size="17">Educational map only. It does not prove production status, approval, adoption, or control effectiveness.</text>
</svg>
