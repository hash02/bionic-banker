<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Open weight AI abstract graphic</title>
  <desc id="desc">Abstract editorial graphic showing model weights as accessible layers with license and workflow checks.</desc>
  <defs>
    <radialGradient id="bg" cx="45%" cy="42%" r="70%"><stop offset="0" stop-color="#164f38" stop-opacity="0.55"/><stop offset="1" stop-color="#08080e"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1200" height="630" fill="#08080e"/>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="930" cy="120" r="190" fill="#1fa068" opacity="0.08" filter="url(#soft)"/>
  <circle cx="260" cy="520" r="240" fill="#1fa068" opacity="0.07" filter="url(#soft)"/>
  <g transform="translate(120 98)">
    <text x="0" y="28" fill="#1fa068" font-family="SF Mono, JetBrains Mono, monospace" font-size="22" letter-spacing="4">DEFINITION</text>
    <text x="0" y="105" fill="#e4e4ec" font-family="Bricolage Grotesque, Plus Jakarta Sans, Arial, sans-serif" font-size="66" font-weight="800">Open Weight AI</text>
    <text x="0" y="150" fill="#b0b0b8" font-family="Plus Jakarta Sans, Arial, sans-serif" font-size="26">Weights available does not always mean open source.</text>
    <g transform="translate(0 225)">
      <rect x="0" y="0" width="260" height="120" rx="18" fill="rgba(8,8,14,0.72)" stroke="#1fa068" stroke-opacity="0.55"/>
      <rect x="330" y="0" width="260" height="120" rx="18" fill="rgba(8,8,14,0.72)" stroke="#1fa068" stroke-opacity="0.35"/>
      <rect x="660" y="0" width="260" height="120" rx="18" fill="rgba(8,8,14,0.72)" stroke="#1fa068" stroke-opacity="0.35"/>
      <text x="32" y="48" fill="#e4e4ec" font-family="Plus Jakarta Sans, Arial" font-size="28" font-weight="700">Weights</text>
      <text x="32" y="82" fill="#9a9aaa" font-family="Plus Jakarta Sans, Arial" font-size="19">learned parameters</text>
      <text x="362" y="48" fill="#e4e4ec" font-family="Plus Jakarta Sans, Arial" font-size="28" font-weight="700">License</text>
      <text x="362" y="82" fill="#9a9aaa" font-family="Plus Jakarta Sans, Arial" font-size="19">what you can do</text>
      <text x="692" y="48" fill="#e4e4ec" font-family="Plus Jakarta Sans, Arial" font-size="28" font-weight="700">Workflow</text>
      <text x="692" y="82" fill="#9a9aaa" font-family="Plus Jakarta Sans, Arial" font-size="19">how it is reviewed</text>
      <path d="M260 60H330M590 60H660" stroke="#1fa068" stroke-width="3" opacity="0.6"/>
    </g>
    <text x="0" y="430" fill="#e4e4ec" font-family="Plus Jakarta Sans, Arial" font-size="26">Control moves closer to the builder. Responsibility moves with it.</text>
  </g>
</svg>
