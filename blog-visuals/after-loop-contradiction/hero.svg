<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#030605"/>
  <defs>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" stroke="#0B2015" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.85"/>
  <rect x="70" y="64" width="1460" height="772" rx="44" fill="#06100C" stroke="#24523A" stroke-width="3"/>
  <text x="120" y="146" fill="#48FF9A" font-family="Inter, DejaVu Sans, Arial" font-size="30" font-weight="700" letter-spacing="2.4">BIONIC BANKER / LOOP ENGINEERING</text>
  <text x="120" y="244" fill="#F2FAF5" font-family="Inter, DejaVu Sans, Arial" font-size="82" font-weight="800">AFTER LOOP,</text>
  <text x="120" y="338" fill="#F2FAF5" font-family="Inter, DejaVu Sans, Arial" font-size="82" font-weight="800">CONTRADICTION.</text>
  <text x="124" y="408" fill="#9DB2A6" font-family="Inter, DejaVu Sans, Arial" font-size="32">A loop without contradiction is automation.</text>
  <text x="124" y="454" fill="#48FF9A" font-family="Inter, DejaVu Sans, Arial" font-size="32" font-weight="700">A loop with contradiction becomes a safety signal.</text>

  <g transform="translate(112 555)">
