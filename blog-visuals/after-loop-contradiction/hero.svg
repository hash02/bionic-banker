    <text x="34" y="98" fill="#9DB2A6" font-family="Inter, DejaVu Sans, Arial" font-size="21">system suggests</text>
  </g>
  <path d="M358 621H447" stroke="#24523A" stroke-width="8" stroke-linecap="round"/>
  <path d="M447 621L422 605V637L447 621Z" fill="#24523A"/>

  <g transform="translate(467 555)">
    <rect x="0" y="0" width="245" height="132" rx="24" fill="#0B1511" stroke="#FFC95A" stroke-width="3" filter="url(#softGlow)"/>
    <text x="31" y="57" fill="#FFC95A" font-family="Inter, DejaVu Sans, Arial" font-size="28" font-weight="800">CHALLENGE</text>
    <text x="31" y="98" fill="#9DB2A6" font-family="Inter, DejaVu Sans, Arial" font-size="21">what breaks it?</text>
  </g>
  <path d="M728 621H817" stroke="#24523A" stroke-width="8" stroke-linecap="round"/>
  <path d="M817 621L792 605V637L817 621Z" fill="#24523A"/>

  <g transform="translate(837 555)">
    <rect x="0" y="0" width="230" height="132" rx="24" fill="#0B1511" stroke="#48FF9A" stroke-width="3" filter="url(#softGlow)"/>
    <text x="33" y="57" fill="#F2FAF5" font-family="Inter, DejaVu Sans, Arial" font-size="28" font-weight="800">REVISION</text>
    <text x="33" y="98" fill="#9DB2A6" font-family="Inter, DejaVu Sans, Arial" font-size="21">plan changes</text>
  </g>
  <path d="M1083 621H1172" stroke="#24523A" stroke-width="8" stroke-linecap="round"/>
  <path d="M1172 621L1147 605V637L1172 621Z" fill="#24523A"/>

  <g transform="translate(1192 555)">
    <rect x="0" y="0" width="285" height="132" rx="24" fill="#13251A" stroke="#48FF9A" stroke-width="3" filter="url(#softGlow)"/>
    <text x="33" y="57" fill="#48FF9A" font-family="Inter, DejaVu Sans, Arial" font-size="28" font-weight="800">HUMAN REVIEW</text>
    <text x="33" y="98" fill="#9DB2A6" font-family="Inter, DejaVu Sans, Arial" font-size="21">approval boundary</text>
  </g>

  <rect x="1204" y="735" width="205" height="76" rx="20" fill="#0B1511" stroke="#48FF9A" stroke-width="2"/>
  <text x="1243" y="783" fill="#48FF9A" font-family="Inter, DejaVu Sans, Arial" font-size="25" font-weight="700">RECORD</text>
  <path d="M1307 690V724" stroke="#24523A" stroke-width="6" stroke-linecap="round"/>
  <path d="M1307 724L1293 702H1321L1307 724Z" fill="#24523A"/>

  <path d="M1307 820C1220 846 990 852 780 850C535 848 305 820 230 714" stroke="#24523A" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 16"/>
