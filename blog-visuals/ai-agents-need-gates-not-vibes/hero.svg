<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI agents need gates, not vibes</title>
  <desc id="desc">A dark green control map showing request, rule, tool, output, check, audit record, and human review.</desc>
  <rect width="1600" height="900" fill="#020704"/>
  <radialGradient id="g" cx="20%" cy="10%" r="70%">
    <stop offset="0" stop-color="#1fa068" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#020704" stop-opacity="0"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#g)"/>
  <text x="100" y="135" fill="#7ee0aa" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="6">BIONIC BANKER</text>
  <text x="100" y="255" fill="#f3fff8" font-family="Inter, Arial, sans-serif" font-size="92" font-weight="900">AI agents need</text>
  <text x="100" y="355" fill="#f3fff8" font-family="Inter, Arial, sans-serif" font-size="92" font-weight="900">gates, not vibes.</text>
  <text x="104" y="430" fill="#cfeadd" font-family="Inter, Arial, sans-serif" font-size="34">The useful demo is not that the agent answered.</text>
  <text x="104" y="478" fill="#cfeadd" font-family="Inter, Arial, sans-serif" font-size="34">It is what it was allowed to do.</text>
  <g transform="translate(100 585)">
    <g fill="#07140d" stroke="#1fa068" stroke-width="2">
      <rect x="0" y="0" width="170" height="90" rx="18"/>
      <rect x="210" y="0" width="170" height="90" rx="18"/>
      <rect x="420" y="0" width="170" height="90" rx="18"/>
      <rect x="630" y="0" width="170" height="90" rx="18"/>
      <rect x="840" y="0" width="170" height="90" rx="18"/>
      <rect x="1050" y="0" width="210" height="90" rx="18"/>
    </g>
    <g fill="#7ee0aa" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="middle">
      <text x="85" y="55">REQUEST</text>
      <text x="295" y="55">RULE</text>
      <text x="505" y="55">TOOL</text>
      <text x="715" y="55">CHECK</text>
      <text x="925" y="55">AUDIT</text>
      <text x="1155" y="55">HUMAN REVIEW</text>
    </g>
    <g stroke="#d7f8e5" stroke-width="3" opacity="0.75">
      <path d="M175 45 L205 45"/><path d="M385 45 L415 45"/><path d="M595 45 L625 45"/><path d="M805 45 L835 45"/><path d="M1015 45 L1045 45"/>
    </g>
  </g>
  <text x="100" y="820" fill="#9fb8aa" font-family="Inter, Arial, sans-serif" font-size="24">request → rule → tool → output → check → audit record → human review</text>
</svg>
