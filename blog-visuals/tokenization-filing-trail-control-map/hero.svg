<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tokenization filing trail control map</title>
  <desc id="desc">A green, black, and white editorial infographic showing a tokenization headline moving through filing trail, entity map, conditional status, asset controls, disclosure limits, and human review.</desc>
  <rect width="1600" height="900" fill="#050805"/>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b160e"/>
      <stop offset="1" stop-color="#071007"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#16351e" stroke-width="1" opacity="0.45"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.65"/>
  <rect x="70" y="70" width="1460" height="760" rx="34" fill="url(#panel)" stroke="#2fd56f" stroke-width="2" opacity="0.96"/>
  <text x="120" y="145" fill="#f5fff6" font-family="Inter, Arial, sans-serif" font-size="54" font-weight="800">Tokenization headline</text>
  <text x="120" y="197" fill="#b7d8bf" font-family="Inter, Arial, sans-serif" font-size="28">Start with the filing trail before treating the story as infrastructure maturity.</text>

  <g transform="translate(118 275)">
    <rect x="0" y="0" width="250" height="126" rx="22" fill="#0f2414" stroke="#7af59c" stroke-width="2"/>
    <text x="28" y="48" fill="#f5fff6" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Headline</text>
    <text x="28" y="86" fill="#b7d8bf" font-family="Inter, Arial, sans-serif" font-size="20">What is claimed?</text>
  </g>
  <g transform="translate(430 275)">
    <rect x="0" y="0" width="250" height="126" rx="22" fill="#0f2414" stroke="#2fd56f" stroke-width="2"/>
    <text x="28" y="48" fill="#f5fff6" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Filing trail</text>
    <text x="28" y="86" fill="#b7d8bf" font-family="Inter, Arial, sans-serif" font-size="20">Which record proves it?</text>
  </g>
  <g transform="translate(742 275)">
    <rect x="0" y="0" width="250" height="126" rx="22" fill="#0f2414" stroke="#2fd56f" stroke-width="2"/>
    <text x="28" y="48" fill="#f5fff6" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Entity map</text>
    <text x="28" y="86" fill="#b7d8bf" font-family="Inter, Arial, sans-serif" font-size="20">Who is involved?</text>
  </g>
  <g transform="translate(1054 275)">
    <rect x="0" y="0" width="250" height="126" rx="22" fill="#0f2414" stroke="#2fd56f" stroke-width="2"/>
    <text x="28" y="48" fill="#f5fff6" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Conditions</text>
    <text x="28" y="86" fill="#b7d8bf" font-family="Inter, Arial, sans-serif" font-size="20">What is not final?</text>
  </g>

  <g stroke="#7af59c" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M370 338h58"/>
    <path d="M682 338h58"/>
    <path d="M994 338h58"/>
  </g>
  <g fill="#7af59c" opacity="0.95">
    <path d="M428 338l-16-10v20z"/>
    <path d="M740 338l-16-10v20z"/>
    <path d="M1052 338l-16-10v20z"/>
  </g>

  <g transform="translate(202 520)">
    <circle cx="70" cy="70" r="68" fill="#102815" stroke="#7af59c" stroke-width="3" filter="url(#softGlow)"/>
    <text x="70" y="62" text-anchor="middle" fill="#f5fff6" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Asset</text>
    <text x="70" y="92" text-anchor="middle" fill="#b7d8bf" font-family="Inter, Arial, sans-serif" font-size="17">proof</text>
  </g>
  <g transform="translate(492 520)">
    <circle cx="70" cy="70" r="68" fill="#102815" stroke="#7af59c" stroke-width="3" filter="url(#softGlow)"/>
    <text x="70" y="62" text-anchor="middle" fill="#f5fff6" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Controls</text>
    <text x="70" y="92" text-anchor="middle" fill="#b7d8bf" font-family="Inter, Arial, sans-serif" font-size="17">records</text>
  </g>
  <g transform="translate(782 520)">
    <circle cx="70" cy="70" r="68" fill="#102815" stroke="#7af59c" stroke-width="3" filter="url(#softGlow)"/>
    <text x="70" y="62" text-anchor="middle" fill="#f5fff6" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Limits</text>
    <text x="70" y="92" text-anchor="middle" fill="#b7d8bf" font-family="Inter, Arial, sans-serif" font-size="17">stated</text>
  </g>
  <g transform="translate(1072 520)">
    <circle cx="70" cy="70" r="68" fill="#102815" stroke="#7af59c" stroke-width="3" filter="url(#softGlow)"/>
    <text x="70" y="62" text-anchor="middle" fill="#f5fff6" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800">Human</text>
    <text x="70" y="92" text-anchor="middle" fill="#b7d8bf" font-family="Inter, Arial, sans-serif" font-size="17">review</text>
  </g>

  <path d="M272 520C300 466 404 452 486 520" fill="none" stroke="#2fd56f" stroke-width="3" opacity="0.65"/>
  <path d="M562 520C590 466 694 452 776 520" fill="none" stroke="#2fd56f" stroke-width="3" opacity="0.65"/>
  <path d="M852 520C880 466 984 452 1066 520" fill="none" stroke="#2fd56f" stroke-width="3" opacity="0.65"/>

  <rect x="120" y="750" width="1240" height="2" fill="#2fd56f" opacity="0.75"/>
  <text x="120" y="792" fill="#f5fff6" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700">Bionic Banker control question:</text>
  <text x="494" y="792" fill="#b7d8bf" font-family="Inter, Arial, sans-serif" font-size="26">What does the record prove, and what still needs review?</text>
</svg>
