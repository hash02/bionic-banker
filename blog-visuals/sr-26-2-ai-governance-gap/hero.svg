<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SR 26-2 and the AI governance gap</title>
  <desc id="desc">A dark green Bionic Banker diagram comparing traditional model risk management with a broader AI governance stack for generative and agentic systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#020604"/>
      <stop offset="0.58" stop-color="#06120c"/>
      <stop offset="1" stop-color="#0b1a12"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" x2="1">
      <stop offset="0" stop-color="#32d583"/>
      <stop offset="1" stop-color="#d6f5e5"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#123023" stroke-width="1" opacity="0.65"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.48"/>
  <circle cx="1340" cy="150" r="280" fill="#1fa068" opacity="0.08"/>
  <circle cx="240" cy="730" r="330" fill="#8fdcb0" opacity="0.055"/>

  <g font-family="Inter, ui-sans-serif, system-ui">
    <text x="105" y="110" fill="#f5fff8" font-size="56" font-weight="850">SR 26-2 updated model risk.</text>
    <text x="107" y="164" fill="#32d583" font-size="34" font-weight="800">It did not solve the AI governance gap.</text>
    <text x="109" y="205" fill="#a9cbb8" font-size="23">Banks need model discipline plus workflow controls for GenAI, agents, vendors, prompts, retrieval, and audit trails.</text>
  </g>

  <g transform="translate(105 285)" font-family="Inter, ui-sans-serif, system-ui">
    <rect x="0" y="0" width="575" height="360" rx="28" fill="#031008" stroke="#1f6f4a" stroke-width="2"/>
    <text x="38" y="58" fill="#e8fff1" font-size="30" font-weight="850">Model risk management</text>
    <text x="40" y="92" fill="#8fbda1" font-size="18">traditional quantitative model discipline</text>
    <g font-size="22" fill="#d6f5e5">
      <text x="45" y="150">• inventory</text>
      <text x="45" y="190">• validation</text>
      <text x="45" y="230">• effective challenge</text>
      <text x="45" y="270">• monitoring</text>
      <text x="45" y="310">• documentation</text>
    </g>
    <rect x="360" y="132" width="150" height="150" rx="24" fill="#06180f" stroke="#32d583" stroke-width="3"/>
    <text x="435" y="190" text-anchor="middle" fill="#f5fff8" font-size="32" font-weight="850">SR</text>
    <text x="435" y="230" text-anchor="middle" fill="#32d583" font-size="36" font-weight="850">26-2</text>
  </g>

  <g transform="translate(920 285)" font-family="Inter, ui-sans-serif, system-ui">
    <rect x="0" y="0" width="575" height="360" rx="28" fill="#031008" stroke="#1f6f4a" stroke-width="2"/>
    <text x="38" y="58" fill="#e8fff1" font-size="30" font-weight="850">AI governance layer</text>
    <text x="40" y="92" fill="#8fbda1" font-size="18">workflow controls for GenAI and agents</text>
    <g font-size="22" fill="#d6f5e5">
      <text x="45" y="150">• prompts and retrieval</text>
      <text x="45" y="190">• vendor model changes</text>
      <text x="45" y="230">• tool permissions</text>
      <text x="45" y="270">• human review</text>
      <text x="45" y="310">• audit trails</text>
    </g>
    <g transform="translate(390 142)">
      <circle cx="52" cy="52" r="52" fill="#06180f" stroke="#32d583" stroke-width="3"/>
      <path d="M52 20 V84 M20 52 H84" stroke="#d6f5e5" stroke-width="9" stroke-linecap="round"/>
      <circle cx="52" cy="52" r="17" fill="#32d583"/>
    </g>
  </g>

  <g transform="translate(690 430)" font-family="Inter, ui-sans-serif, system-ui" filter="url(#glow)">
    <path d="M0 34 H220" stroke="url(#bridge)" stroke-width="8" stroke-linecap="round"/>
    <path d="M220 34 L190 14 M220 34 L190 54" stroke="#d6f5e5" stroke-width="8" stroke-linecap="round" fill="none"/>
    <rect x="28" y="-33" width="168" height="55" rx="16" fill="#06120c" stroke="#d6f5e5" stroke-width="2"/>
    <text x="112" y="3" fill="#f5fff8" font-size="19" font-weight="800" text-anchor="middle">connected controls</text>
  </g>

  <g transform="translate(135 705)" font-family="Inter, ui-sans-serif, system-ui">
    <rect width="1330" height="105" rx="28" fill="#020604" opacity="0.80" stroke="#1f6f4a"/>
    <text x="36" y="43" fill="#e8fff1" font-size="27" font-weight="850">The better question:</text>
    <text x="36" y="78" fill="#32d583" font-size="29" font-weight="850">What decision can this system influence — and who owns the control?</text>
  </g>

  <text x="112" y="855" fill="#749982" font-family="Inter, ui-sans-serif, system-ui" font-size="20">Bionic Banker · model risk, AI governance, and financial infrastructure</text>
</svg>
