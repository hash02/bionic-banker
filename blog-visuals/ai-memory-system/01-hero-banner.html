<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #020204;
    color: #e4e4ec;
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }

  .hero {
    width: 1200px;
    height: 630px;
    background: #020204;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 80px;
  }

  /* Animated memory layers background */
  .layer-lines {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  .layer-line {
    position: absolute;
    left: 0;
    width: 100%;
    height: 1px;
    opacity: 0.08;
  }

  .layer-line:nth-child(1) { top: 16%; background: linear-gradient(90deg, transparent 0%, #ff4444 30%, #ff4444 70%, transparent 100%); animation: pulse 4s ease-in-out infinite; }
  .layer-line:nth-child(2) { top: 32%; background: linear-gradient(90deg, transparent 0%, #ff8c44 30%, #ff8c44 70%, transparent 100%); animation: pulse 4s ease-in-out 0.5s infinite; }
  .layer-line:nth-child(3) { top: 48%; background: linear-gradient(90deg, transparent 0%, #1fa068 30%, #1fa068 70%, transparent 100%); animation: pulse 4s ease-in-out 1s infinite; }
  .layer-line:nth-child(4) { top: 64%; background: linear-gradient(90deg, transparent 0%, #5b73f8 30%, #5b73f8 70%, transparent 100%); animation: pulse 4s ease-in-out 1.5s infinite; }
  .layer-line:nth-child(5) { top: 80%; background: linear-gradient(90deg, transparent 0%, #8b6cf7 30%, #8b6cf7 70%, transparent 100%); animation: pulse 4s ease-in-out 2s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 0.06; height: 1px; }
    50% { opacity: 0.2; height: 2px; }
  }

  /* Floating memory nodes */
  .nodes {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  .node {
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    animation: float 8s ease-in-out infinite;
  }

  .node:nth-child(1) { top: 15%; left: 85%; background: #ff4444; animation-delay: 0s; }
  .node:nth-child(2) { top: 30%; left: 75%; background: #ff8c44; animation-delay: 1s; }
  .node:nth-child(3) { top: 50%; left: 90%; background: #1fa068; animation-delay: 2s; }
  .node:nth-child(4) { top: 65%; left: 80%; background: #5b73f8; animation-delay: 3s; }
  .node:nth-child(5) { top: 78%; left: 88%; background: #8b6cf7; animation-delay: 4s; }
  .node:nth-child(6) { top: 20%; left: 70%; background: #1fa068; animation-delay: 1.5s; width: 4px; height: 4px; }
  .node:nth-child(7) { top: 45%; left: 82%; background: #ff4444; animation-delay: 2.5s; width: 4px; height: 4px; }
  .node:nth-child(8) { top: 72%; left: 72%; background: #5b73f8; animation-delay: 3.5s; width: 4px; height: 4px; }

  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.4; }
    50% { transform: translateY(-12px) scale(1.3); opacity: 0.8; }
  }

  /* Side decoration — layer stack */
  .stack-viz {
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .stack-block {
    width: 180px;
    height: 52px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    opacity: 0;
    animation: slideIn 0.5s ease forwards;
  }

  .stack-block:nth-child(1) { background: rgba(255,68,68,0.15); border: 1px solid rgba(255,68,68,0.3); color: #ff4444; animation-delay: 0.2s; }
  .stack-block:nth-child(2) { background: rgba(255,140,68,0.15); border: 1px solid rgba(255,140,68,0.3); color: #ff8c44; animation-delay: 0.4s; }
  .stack-block:nth-child(3) { background: rgba(31,160,104,0.15); border: 1px solid rgba(31,160,104,0.3); color: #1fa068; animation-delay: 0.6s; }
  .stack-block:nth-child(4) { background: rgba(91,115,248,0.15); border: 1px solid rgba(91,115,248,0.3); color: #5b73f8; animation-delay: 0.8s; }
  .stack-block:nth-child(5) { background: rgba(139,108,247,0.15); border: 1px solid rgba(139,108,247,0.3); color: #8b6cf7; animation-delay: 1.0s; }

  .stack-num {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 800;
    margin-right: 10px;
    background: rgba(255,255,255,0.1);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* Title content */
  .tag {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #1fa068;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tag::before {
    content: '';
    width: 24px;
    height: 2px;
    background: #1fa068;
  }

  h1 {
    font-family: 'Bricolage Grotesque', serif;
    font-size: 48px;
    font-weight: 800;
    line-height: 1.1;
    max-width: 620px;
    background: linear-gradient(135deg, #e4e4ec 0%, #a8a8b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 20px;
  }

  .subtitle {
    font-size: 17px;
    color: #8888a0;
    max-width: 500px;
    line-height: 1.5;
    font-weight: 400;
  }

  .subtitle em {
    color: #1fa068;
    font-style: normal;
    font-weight: 600;
  }

  .brand {
    position: absolute;
    bottom: 30px;
    left: 80px;
    font-family: 'Bricolage Grotesque', serif;
    font-size: 14px;
    font-weight: 700;
    color: #555;
    letter-spacing: 0.05em;
  }

  .brand span {
    background: linear-gradient(135deg, #5b73f8, #8b6cf7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
</style>
</head>
<body>
  <div class="hero">
    <div class="layer-lines">
      <div class="layer-line"></div>
      <div class="layer-line"></div>
      <div class="layer-line"></div>
      <div class="layer-line"></div>
      <div class="layer-line"></div>
    </div>

    <div class="nodes">
      <div class="node"></div>
      <div class="node"></div>
      <div class="node"></div>
      <div class="node"></div>
      <div class="node"></div>
      <div class="node"></div>
      <div class="node"></div>
      <div class="node"></div>
    </div>

    <div class="tag">Deep Dive · AI Agents</div>

    <h1>How I Built a Memory System That Survives AI Context Death</h1>

    <p class="subtitle">Everyone's building AI memory as <em>retrieval</em>. The actual problem is <em>continuity</em>. Five layers. Markdown files. An immune system.</p>

    <div class="stack-viz">
      <div class="stack-block"><span class="stack-num">1</span> Boot Memory</div>
      <div class="stack-block"><span class="stack-num">2</span> Episodes</div>
      <div class="stack-block"><span class="stack-num">3</span> Immune System</div>
      <div class="stack-block"><span class="stack-num">4</span> Identity</div>
      <div class="stack-block"><span class="stack-num">5</span> Knowledge Base</div>
    </div>

    <div class="brand">bionic<span>banker</span>.tech</div>
  </div>
</body>
</html>
