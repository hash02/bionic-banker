<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI model access as a sovereignty boundary</title>
  <desc id="desc">A dark green technical map showing chips, cloud, model weights, APIs, employee access, and workflows as layers behind a geopolitical access boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#020604"/>
      <stop offset="0.58" stop-color="#06120c"/>
      <stop offset="1" stop-color="#0b1a12"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#32d583"/>
      <stop offset="0.5" stop-color="#1fa068"/>
      <stop offset="1" stop-color="#d6f5e5"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#123023" stroke-width="1" opacity="0.65"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.55"/>
  <circle cx="1290" cy="145" r="265" fill="#1fa068" opacity="0.08"/>
  <circle cx="255" cy="765" r="335" fill="#8fdcb0" opacity="0.055"/>

  <g transform="translate(106 88)" font-family="Inter, ui-sans-serif, system-ui">
    <text x="0" y="0" fill="#f5fff8" font-size="54" font-weight="850">AI model access is now a boundary</text>
    <text x="2" y="52" fill="#a9cbb8" font-size="25">When hosted APIs become controlled capability, access is not the same as control.</text>
  </g>

  <g transform="translate(120 255)">
    <path d="M85 220 H1320" stroke="url(#line)" stroke-width="8" stroke-linecap="round" opacity="0.92" filter="url(#glow)"/>
    <g font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="760" text-anchor="middle">
      <g transform="translate(85 220)">
        <circle r="39" fill="#04100a" stroke="#32d583" stroke-width="4"/>
        <text y="8" fill="#e8fff1">chips</text>
      </g>
      <g transform="translate(315 220)">
        <circle r="43" fill="#04100a" stroke="#32d583" stroke-width="4"/>
        <text y="8" fill="#e8fff1">cloud</text>
      </g>
      <g transform="translate(555 220)">
        <circle r="55" fill="#04100a" stroke="#48c78e" stroke-width="4"/>
        <text y="-4" fill="#e8fff1">model</text>
        <text y="23" fill="#e8fff1">weights</text>
      </g>
      <g transform="translate(805 220)">
        <circle r="48" fill="#04100a" stroke="#8fdcb0" stroke-width="4"/>
        <text y="8" fill="#f5fff8">APIs</text>
      </g>
      <g transform="translate(1055 220)">
        <circle r="62" fill="#04100a" stroke="#b6e7c9" stroke-width="4"/>
        <text y="-4" fill="#f5fff8">employee</text>
        <text y="23" fill="#f5fff8">access</text>
      </g>
      <g transform="translate(1320 220)">
        <circle r="67" fill="#04100a" stroke="#d6f5e5" stroke-width="4"/>
        <text y="-4" fill="#ffffff">production</text>
        <text y="23" fill="#ffffff">workflows</text>
      </g>
    </g>

    <g transform="translate(704 0)" font-family="Inter, ui-sans-serif, system-ui">
      <rect x="0" y="0" width="342" height="96" rx="22" fill="#06120c" stroke="#d6f5e5" stroke-width="2.5" opacity="0.97"/>
      <text x="171" y="39" fill="#f5fff8" font-size="24" font-weight="850" text-anchor="middle">EXPORT / ACCESS</text>
      <text x="171" y="68" fill="#32d583" font-size="18" text-anchor="middle">policy enters the API layer</text>
    </g>
    <path d="M875 96 V172" stroke="#d6f5e5" stroke-width="3" stroke-dasharray="10 10" opacity="0.85"/>
  </g>

  <g transform="translate(125 650)" font-family="Inter, ui-sans-serif, system-ui">
    <rect width="1350" height="118" rx="28" fill="#020604" opacity="0.78" stroke="#1f6f4a"/>
    <text x="36" y="48" fill="#e8fff1" font-size="27" font-weight="850">The question for non-U.S. builders:</text>
    <text x="36" y="86" fill="#32d583" font-size="30" font-weight="850">Do you control AI capability — or only rent access to it?</text>
  </g>

  <text x="112" y="840" fill="#749982" font-family="Inter, ui-sans-serif, system-ui" font-size="20">Bionic Banker · AI infrastructure, sovereignty, and finance workflows</text>
</svg>