<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">SYOS loop engineering proof timeline</title>
  <desc id="desc">Timeline from January 2025 conversation to June and July 2025 public repos and development workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#08080e"/><stop offset="1" stop-color="#0c1d18"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop offset="0" stop-color="#1fa068"/><stop offset="1" stop-color="#9effd7"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.38"/></filter>
  </defs>
  <rect width="1600" height="1100" fill="url(#bg)"/>
  <text x="90" y="95" fill="#8fffd1" font-family="Inter, Arial, sans-serif" font-size="22" letter-spacing="4">PROOF TIMELINE</text>
  <text x="90" y="160" fill="#f4fff9" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="900">From conversation to code</text>
  <text x="90" y="208" fill="#c9d8d2" font-family="Inter, Arial, sans-serif" font-size="25">A public-safe trail for SYOS and loop engineering.</text>
  <line x1="170" y1="330" x2="1430" y2="330" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Inter, Arial, sans-serif" filter="url(#shadow)">
    <g transform="translate(90 270)">
      <circle cx="80" cy="60" r="28" fill="#1fa068"/>
      <rect x="0" y="120" width="270" height="230" rx="24" fill="#0d1414" stroke="#31594c"/>
      <text x="28" y="170" fill="#8fffd1" font-size="21" font-weight="800">JAN 15 2025</text>
      <text x="28" y="212" fill="#fff" font-size="28" font-weight="900">Conversation</text>
      <text x="28" y="252" fill="#c9d8d2" font-size="20">The work starts as</text>
      <text x="28" y="280" fill="#c9d8d2" font-size="20">talking to the model</text>
      <text x="28" y="308" fill="#c9d8d2" font-size="20">and noticing drift.</text>
    </g>
    <g transform="translate(405 270)">
      <circle cx="80" cy="60" r="28" fill="#1fa068"/>
      <rect x="0" y="120" width="270" height="230" rx="24" fill="#0d1414" stroke="#31594c"/>
      <text x="28" y="170" fill="#8fffd1" font-size="21" font-weight="800">JUN 16 2025</text>
      <text x="28" y="212" fill="#fff" font-size="28" font-weight="900">Public repos</text>
      <text x="28" y="252" fill="#c9d8d2" font-size="20">SYOS and SYOS-System</text>
      <text x="28" y="280" fill="#c9d8d2" font-size="20">created on GitHub.</text>
      <text x="28" y="308" fill="#c9d8d2" font-size="20">Symbolic logical system.</text>
    </g>
    <g transform="translate(720 270)">
      <circle cx="80" cy="60" r="28" fill="#1fa068"/>
      <rect x="0" y="120" width="270" height="230" rx="24" fill="#0d1414" stroke="#31594c"/>
      <text x="28" y="170" fill="#8fffd1" font-size="21" font-weight="800">JUL 2 2025</text>
      <text x="28" y="212" fill="#fff" font-size="28" font-weight="900">Dev workspace</text>
      <text x="28" y="252" fill="#c9d8d2" font-size="20">Python, memory.json,</text>
      <text x="28" y="280" fill="#c9d8d2" font-size="20">config, VS Code, venv,</text>
      <text x="28" y="308" fill="#c9d8d2" font-size="20">GitHub folder.</text>
    </g>
    <g transform="translate(1035 270)">
      <circle cx="80" cy="60" r="28" fill="#1fa068"/>
      <rect x="0" y="120" width="270" height="230" rx="24" fill="#0d1414" stroke="#31594c"/>
      <text x="28" y="170" fill="#8fffd1" font-size="21" font-weight="800">JUL 6 2025</text>
      <text x="28" y="212" fill="#fff" font-size="28" font-weight="900">DApp + loops</text>
      <text x="28" y="252" fill="#c9d8d2" font-size="20">DappSyos pushed.</text>
      <text x="28" y="280" fill="#c9d8d2" font-size="20">Loop detection, drift</text>
      <text x="28" y="308" fill="#c9d8d2" font-size="20">management, memory.</text>
    </g>
  </g>
  <g transform="translate(180 720)" font-family="Inter, Arial, sans-serif">
    <rect width="1240" height="210" rx="32" fill="#08100f" stroke="#31594c"/>
    <text x="50" y="62" fill="#8fffd1" font-size="22" font-weight="900">WHAT THIS PROVES</text>
    <text x="50" y="115" fill="#f4fff9" font-size="34" font-weight="900">The work moved from conversation into code, repos, memory, drift checks, and prototype surfaces.</text>
    <text x="50" y="166" fill="#c9d8d2" font-size="23">It does not prove “first.” It proves an early build trail around the primitives now central to agent systems.</text>
  </g>
  <text x="90" y="1030" fill="#71827c" font-family="Inter, Arial, sans-serif" font-size="18">Public proof: github.com/hash02/SYOS · github.com/hash02/SYOS-System · github.com/hash02/DappSyos</text>
</svg>
