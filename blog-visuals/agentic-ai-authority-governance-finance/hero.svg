<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agentic AI authority governance in finance</title>
  <desc id="desc">A dark green Bionic Banker style diagram showing agentic AI moving from tools to authority boundaries across financial workflows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#020604"/>
      <stop offset="0.58" stop-color="#06120c"/>
      <stop offset="1" stop-color="#0b1a12"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" x2="1">
      <stop offset="0" stop-color="#32d583"/>
      <stop offset="1" stop-color="#d6f5e5"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#123023" stroke-width="1" opacity="0.65"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.55"/>
  <circle cx="1280" cy="170" r="280" fill="#1fa068" opacity="0.08"/>
  <circle cx="260" cy="780" r="340" fill="#8fdcb0" opacity="0.055"/>

  <g font-family="Inter, ui-sans-serif, system-ui">
    <text x="108" y="112" fill="#f5fff8" font-size="54" font-weight="850">Agentic AI needs authority governance</text>
    <text x="110" y="164" fill="#a9cbb8" font-size="25">Finance has to govern what agents are allowed to do, not only which tools they use.</text>
  </g>

  <g transform="translate(130 250)" font-family="Inter, ui-sans-serif, system-ui">
    <rect x="0" y="95" width="330" height="260" rx="28" fill="#031008" stroke="#1f6f4a" stroke-width="2"/>
    <text x="38" y="148" fill="#32d583" font-size="24" font-weight="850">TOOL GOVERNANCE</text>
    <text x="38" y="196" fill="#e8fff1" font-size="26" font-weight="750">Which platform?</text>
    <text x="38" y="236" fill="#a9cbb8" font-size="21">vendor</text>
    <text x="38" y="270" fill="#a9cbb8" font-size="21">data policy</text>
    <text x="38" y="304" fill="#a9cbb8" font-size="21">approved users</text>

    <path d="M380 225 H620" stroke="url(#rail)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
    <polygon points="620,225 584,204 584,246" fill="#d6f5e5"/>
    <text x="440" y="192" fill="#d6f5e5" font-size="22" font-weight="780">agentic shift</text>

    <rect x="675" y="40" width="675" height="370" rx="34" fill="#04100a" stroke="#32d583" stroke-width="3"/>
    <text x="720" y="96" fill="#f5fff8" font-size="34" font-weight="850">AUTHORITY GOVERNANCE</text>
    <text x="720" y="138" fill="#32d583" font-size="23">What can the system do before a human approves?</text>

    <g font-size="22" fill="#e8fff1">
      <text x="735" y="198">01 Decide</text>
      <text x="980" y="198">02 Touch systems</text>
      <text x="1210" y="198">03 Keep evidence</text>
      <text x="735" y="260">04 Escalate</text>
      <text x="980" y="260">05 Pause</text>
      <text x="1210" y="260">06 Log</text>
      <text x="735" y="322">07 Own outcome</text>
      <text x="980" y="322">08 Change safely</text>
    </g>
  </g>

  <g transform="translate(130 700)" font-family="Inter, ui-sans-serif, system-ui">
    <rect width="1340" height="105" rx="27" fill="#020604" opacity="0.8" stroke="#1f6f4a"/>
    <text x="38" y="44" fill="#e8fff1" font-size="26" font-weight="850">The control question:</text>
    <text x="38" y="80" fill="#32d583" font-size="29" font-weight="850">What is this agent allowed to do, where must it stop, and who owns the outcome?</text>
  </g>

  <text x="112" y="850" fill="#749982" font-family="Inter, ui-sans-serif, system-ui" font-size="20">Bionic Banker · AI governance, financial stability, and controlled autonomy</text>
</svg>
