<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Anchor Problem — Hero Visual</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #020204;
    color: #e4e4ec;
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow: hidden;
    width: 100%;
    height: 100vh;
    min-height: 500px;
    max-height: 600px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
  .overlay {
    position: relative;
    z-index: 2;
    text-align: center;
    width: 90%;
    max-width: 800px;
  }
  .title {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: clamp(1.6rem, 4vw, 2.8rem);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.15;
    margin-bottom: 1rem;
    opacity: 0;
    animation: fadeUp 1.2s ease forwards 0.3s;
  }
  .title .accent-green { color: #1fa068; }
  .title .accent-red { color: #1fa068; }
  .subtitle {
    font-size: clamp(0.85rem, 1.5vw, 1rem);
    color: rgba(228,228,236,0.55);
    font-weight: 400;
    line-height: 1.6;
    max-width: 520px;
    margin: 0 auto;
    opacity: 0;
    animation: fadeUp 1.2s ease forwards 0.7s;
  }
  .label-row {
    display: flex;
    justify-content: center;
    gap: 3rem;
    margin-top: 2rem;
    opacity: 0;
    animation: fadeUp 1s ease forwards 1.1s;
  }
  .label-item {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot.green { background: #1fa068; box-shadow: 0 0 10px rgba(31,160,104,0.5); }
  .dot.red { background: #1fa068; box-shadow: 0 0 10px rgba(31,160,104,0.5); }
  .watermark {
    position: absolute;
    bottom: 12px;
    right: 16px;
    font-size: 0.6rem;
    color: rgba(228,228,236,0.15);
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    z-index: 3;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

html{scrollbar-width:thin;scrollbar-color:rgba(31,160,104,0.3) #020204}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#020204}
::-webkit-scrollbar-thumb{background:rgba(31,160,104,0.3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(31,160,104,0.5)}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div class="overlay">
  <div class="title">
    <span class="accent-red">Without an anchor</span>, intelligence is just<br>
    a <span class="accent-red">confident dream</span>.<br>
    <span class="accent-green">With one</span>, it can <span class="accent-green">wake up</span>.
  </div>
  <div class="subtitle">
    AI doesn't hallucinate because it's dumb. It hallucinates because it has no fixed reference point to drift from.
  </div>
  <div class="label-row">
    <div class="label-item"><span class="dot green"></span> Anchored</div>
    <div class="label-item"><span class="dot red"></span> Unanchored</div>
  </div>
</div>

<div class="watermark">Bionic Banker</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W, H, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = canvas.clientWidth;
  H = canvas.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// Anchored node (left side) — stays near its anchor
// Unanchored node (right side) — drifts wildly

class Node {
  constructor(x, y, anchored) {
    this.anchorX = x;
    this.anchorY = y;
    this.x = x;
    this.y = y;
    this.anchored = anchored;
    this.trail = [];
    this.phase = Math.random() * Math.PI * 2;
    this.speed = 0.003 + Math.random() * 0.002;
  }
  update(t) {
    if (this.anchored) {
      // Gentle orbit around anchor
      const radius = 15 + Math.sin(t * 0.001 + this.phase) * 8;
      this.x = this.anchorX + Math.cos(t * this.speed + this.phase) * radius;
      this.y = this.anchorY + Math.sin(t * this.speed * 1.3 + this.phase) * radius;
    } else {
      // Wild drift
      const drift = 60 + Math.sin(t * 0.0005) * 30;
      this.x = this.anchorX + Math.sin(t * this.speed + this.phase) * drift + Math.cos(t * 0.002 + this.phase * 2) * drift * 0.5;
      this.y = this.anchorY + Math.cos(t * this.speed * 0.7 + this.phase) * drift + Math.sin(t * 0.0015) * drift * 0.4;
    }
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > 60) this.trail.shift();
  }
}

// Create nodes
const anchoredNodes = [];
const unanchoredNodes = [];
const leftCenter = () => ({ x: W * 0.22, y: H * 0.5 });
const rightCenter = () => ({ x: W * 0.78, y: H * 0.5 });

for (let i = 0; i < 6; i++) {
  const lc = leftCenter();
  const rc = rightCenter();
  anchoredNodes.push(new Node(
    lc.x + (Math.random() - 0.5) * 40,
    lc.y + (Math.random() - 0.5) * 40,
    true
  ));
  unanchoredNodes.push(new Node(
    rc.x + (Math.random() - 0.5) * 40,
    rc.y + (Math.random() - 0.5) * 40,
    false
  ));
}

// Particles for atmosphere
const particles = [];
for (let i = 0; i < 50; i++) {
  particles.push({
    x: Math.random() * 2000,
    y: Math.random() * 800,
    r: Math.random() * 1.2 + 0.3,
    speed: Math.random() * 0.15 + 0.05,
    alpha: Math.random() * 0.15 + 0.03
  });
}

function drawAnchorPoint(x, y, t) {
  // Pulsing anchor
  const pulse = 1 + Math.sin(t * 0.003) * 0.15;
  const r = 6 * pulse;
  ctx.beginPath();
  ctx.arc(x, y, r + 8, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(31,160,104,0.06)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x, y, r + 3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(31,160,104,0.12)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = '#1fa068';
  ctx.shadowColor = '#1fa068';
  ctx.shadowBlur = 15;
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawNode(node, color) {
  // Trail
  for (let i = 0; i < node.trail.length - 1; i++) {
    const alpha = (i / node.trail.length) * 0.25;
    ctx.beginPath();
    ctx.moveTo(node.trail[i].x, node.trail[i].y);
    ctx.lineTo(node.trail[i + 1].x, node.trail[i + 1].y);
    ctx.strokeStyle = color.replace('1)', alpha + ')');
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  // Node
  ctx.beginPath();
  ctx.arc(node.x, node.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = color.replace('1)', '0.8)');
  ctx.shadowColor = color.replace('1)', '0.4)');
  ctx.shadowBlur = 8;
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawConnection(a, b, color, alpha) {
  ctx.beginPath();
  ctx.moveTo(a.x, a.y);
  ctx.lineTo(b.x, b.y);
  ctx.strokeStyle = color.replace('1)', alpha + ')');
  ctx.lineWidth = 0.5;
  ctx.stroke();
}

let startTime = performance.now();

function animate() {
  const t = performance.now() - startTime;
  ctx.clearRect(0, 0, W, H);

  // Background gradient
  const grad = ctx.createRadialGradient(W * 0.5, H * 0.5, 0, W * 0.5, H * 0.5, W * 0.7);
  grad.addColorStop(0, 'rgba(10,10,20,0.3)');
  grad.addColorStop(1, 'rgba(2,2,4,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Particles
  particles.forEach(p => {
    p.y -= p.speed;
    if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(228,228,236,${p.alpha})`;
    ctx.fill();
  });

  // Update anchor positions based on current size
  const lc = leftCenter();
  const rc = rightCenter();
  anchoredNodes.forEach((n, i) => {
    n.anchorX = lc.x + (i - 2.5) * 15;
    n.anchorY = lc.y + (i % 2 === 0 ? -15 : 15);
    n.update(t);
  });
  unanchoredNodes.forEach((n, i) => {
    n.anchorX = rc.x + (i - 2.5) * 15;
    n.anchorY = rc.y + (i % 2 === 0 ? -15 : 15);
    n.update(t);
  });

  // Draw anchor point (left side)
  drawAnchorPoint(lc.x, lc.y, t);

  // Draw tether lines from anchored nodes to anchor
  anchoredNodes.forEach(n => {
    ctx.beginPath();
    ctx.moveTo(lc.x, lc.y);
    ctx.lineTo(n.x, n.y);
    ctx.strokeStyle = 'rgba(31,160,104,0.15)';
    ctx.lineWidth = 0.8;
    ctx.setLineDash([3, 4]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // Draw connections between nodes
  for (let i = 0; i < anchoredNodes.length; i++) {
    for (let j = i + 1; j < anchoredNodes.length; j++) {
      drawConnection(anchoredNodes[i], anchoredNodes[j], 'rgba(31,160,104,1)', 0.08);
    }
  }
  for (let i = 0; i < unanchoredNodes.length; i++) {
    for (let j = i + 1; j < unanchoredNodes.length; j++) {
      drawConnection(unanchoredNodes[i], unanchoredNodes[j], 'rgba(31,160,104,1)', 0.06);
    }
  }

  // Draw nodes
  anchoredNodes.forEach(n => drawNode(n, 'rgba(31,160,104,1)'));
  unanchoredNodes.forEach(n => drawNode(n, 'rgba(31,160,104,1)'));

  // Ghost anchor for unanchored side (faded, no connection)
  ctx.beginPath();
  ctx.arc(rc.x, rc.y, 6, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(31,160,104,0.12)';
  ctx.lineWidth = 1;
  ctx.setLineDash([2, 3]);
  ctx.stroke();
  ctx.setLineDash([]);

  requestAnimationFrame(animate);
}
animate();
</script>

<script>
function sendHeight(){
  var h=Math.max(document.body.scrollHeight,document.body.offsetHeight,document.documentElement.scrollHeight);
  window.parent.postMessage({type:'iframeResize',height:h,src:location.pathname},'*');
}
window.addEventListener('load',function(){sendHeight();setTimeout(sendHeight,500);setTimeout(sendHeight,1500)});
window.addEventListener('resize',sendHeight);
new ResizeObserver(sendHeight).observe(document.body);
</script>
</body>
</html>
