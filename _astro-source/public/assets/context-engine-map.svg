<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Context engine map</title>
  <desc id="desc">A source-led context engine turns raw records into agent plans, AML review questions, wallet watch reports, public records, and human next steps.</desc>
  <rect width="1200" height="760" fill="#020604"/>
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#1fa068" stop-opacity="0.9"/><stop offset="1" stop-color="#8ff0b7" stop-opacity="0.55"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .label{font-family:Inter,Arial,sans-serif;font-size:20px;font-weight:800;fill:#f4f7f1}.small{font-family:Inter,Arial,sans-serif;font-size:15px;fill:#b7c8bd}.tiny{font-family:Inter,Arial,sans-serif;font-size:13px;fill:#8ea59a}.box{fill:#07130d;stroke:#1fa068;stroke-opacity:.55;stroke-width:2}.core{fill:#0b2517;stroke:url(#g);stroke-width:3}.line{stroke:#1fa068;stroke-opacity:.65;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#1fa068"/></marker>
  </defs>
  <text x="60" y="62" class="label" font-size="30">Context Engine Map</text>
  <text x="60" y="92" class="small">Access is not understanding. The useful layer checks source, conflict, permission, pattern, missing context, and limit.</text>
  <g transform="translate(50 145)">
    <rect class="box" rx="22" width="275" height="370"/>
    <text x="28" y="45" class="label">Raw sources</text>
    <text x="28" y="88" class="small">Public explorer</text><text x="28" y="122" class="small">Wallet label</text><text x="28" y="156" class="small">Market row</text><text x="28" y="190" class="small">Repo record</text><text x="28" y="224" class="small">Vault note</text><text x="28" y="258" class="small">Cron output</text><text x="28" y="292" class="small">Human correction</text>
  </g>
  <path class="line" d="M340 330 C410 330 420 330 485 330"/>
  <g transform="translate(480 130)">
    <rect class="core" rx="28" width="300" height="430" filter="url(#glow)"/>
    <text x="32" y="48" class="label">Context engine</text>
    <text x="32" y="92" class="small">Source check</text><text x="32" y="126" class="small">Conflict check</text><text x="32" y="160" class="small">Permission check</text><text x="32" y="194" class="small">Pattern check</text><text x="32" y="228" class="small">Missing-context label</text><text x="32" y="262" class="small">Authority ranking</text><text x="32" y="296" class="small">Token compression</text><text x="32" y="352" class="tiny">Output should be small, cited, current, and bounded.</text>
  </g>
  <path class="line" d="M785 330 C855 330 865 330 930 330"/>
  <g transform="translate(925 145)">
    <rect class="box" rx="22" width="225" height="370"/>
    <text x="28" y="45" class="label">Outputs</text>
    <text x="28" y="88" class="small">Agent plan</text><text x="28" y="122" class="small">AML review question</text><text x="28" y="156" class="small">Wallet watch report</text><text x="28" y="190" class="small">Public system record</text><text x="28" y="224" class="small">Human next step</text><text x="28" y="292" class="tiny">No trade advice. No accusation. No wallet control.</text>
  </g>
  <rect x="120" y="610" width="960" height="78" rx="20" fill="#06100a" stroke="#1fa068" stroke-opacity=".45"/>
  <text x="155" y="643" class="small">Bionic Banker rule:</text>
  <text x="155" y="672" class="label" font-size="22">show the source, show the question, show what the system cannot decide.</text>
</svg>