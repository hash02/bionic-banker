<!DOCTYPE html>
<html lang="en">
<head><style>body,html{background:#08080e!important}canvas,canvas.vanta-canvas{background:#08080e!important}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Agentic Gap — Hero Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #020204;
    color: #e4e4ec;
    font-family: 'Plus Jakarta Sans', sans-serif;
    overflow: hidden;
    width: 100%;
    height: 100vh;
    min-height: 500px;
    max-height: 630px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .hero {
    width: 1200px;
    height: 630px;
    background: linear-gradient(135deg, #020204 0%, #0a0a10 50%, #020204 100%);
    border: 1px solid rgba(31, 160, 104, 0.13);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 80px;
    text-align: center;
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 50%, rgba(31, 160, 104, 0.06) 0%, transparent 50%);
    animation: floatBg 8s ease-in-out infinite;
    pointer-events: none;
  }

  .hero::after {
    content: '';
    position: absolute;
    top: -50%;
    right: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 70% 50%, rgba(31, 160, 104, 0.04) 0%, transparent 50%);
    animation: floatBg2 10s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes floatBg {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(30px, 30px); }
  }
  @keyframes floatBg2 {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(-30px, -30px); }
  }

  .hero-content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 30px;
  }

  h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 72px;
    font-weight: 800;
    color: #e4e4ec;
    line-height: 1.1;
    letter-spacing: -1px;
    animation: slideDown 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  h1 .accent { color: #1fa068; }

  .subtitle {
    font-size: 24px;
    color: #b0b0bc;
    font-weight: 500;
    max-width: 600px;
    animation: slideUp 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s backwards;
  }

  @keyframes slideDown {
    from { opacity: 0; transform: translateY(-40px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .race-track {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 800px;
    margin-top: 20px;
    animation: fadeIn 0.8s ease-out 0.4s backwards;
  }

  .race-lane {
    display: flex;
    align-items: center;
    gap: 15px;
    height: 44px;
  }

  .flag-icon {
    width: 42px;
    height: 42px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    background: rgba(31, 160, 104, 0.08);
    border: 1px solid rgba(31, 160, 104, 0.18);
    flex-shrink: 0;
  }

  .country-name {
    font-size: 12px;
    color: #888890;
    font-weight: 600;
    width: 55px;
    text-align: left;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .progress-bar {
    flex: 1;
    height: 6px;
    background: rgba(31, 160, 104, 0.08);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #1fa068, #2dd685);
    border-radius: 3px;
    width: 0;
    animation: progressGrow 2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .race-lane:nth-child(1) .progress-fill { --target-width: 95%; animation-delay: 0.5s; }
  .race-lane:nth-child(2) .progress-fill { --target-width: 72%; animation-delay: 0.7s; }
  .race-lane:nth-child(3) .progress-fill { --target-width: 58%; animation-delay: 0.9s; }
  .race-lane:nth-child(4) .progress-fill { --target-width: 48%; animation-delay: 1.1s; }

  @keyframes progressGrow {
    to { width: var(--target-width); }
  }

  .branding {
    position: absolute;
    bottom: 20px;
    right: 30px;
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 11px;
    color: rgba(228,228,236,0.15);
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    z-index: 10;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  html{scrollbar-width:thin;scrollbar-color:rgba(31,160,104,0.3) #020204}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-track{background:#020204}
  ::-webkit-scrollbar-thumb{background:rgba(31,160,104,0.3);border-radius:3px}
</style>
</head>
<body>
  <div class="hero">
    <div class="hero-content">
      <h1><span class="accent">The Agentic Gap</span></h1>
      <p class="subtitle">How the World's Banks Are Deploying AI Agents</p>

      <div class="race-track">
        <div class="race-lane">
          <div class="flag-icon">&#x1F1FA;&#x1F1F8;</div>
          <div class="country-name">US</div>
          <div class="progress-bar"><div class="progress-fill"></div></div>
        </div>
        <div class="race-lane">
          <div class="flag-icon">&#x1F1EE;&#x1F1F3;</div>
          <div class="country-name">India</div>
          <div class="progress-bar"><div class="progress-fill"></div></div>
        </div>
        <div class="race-lane">
          <div class="flag-icon">&#x1F1E6;&#x1F1FA;</div>
          <div class="country-name">AU</div>
          <div class="progress-bar"><div class="progress-fill"></div></div>
        </div>
        <div class="race-lane">
          <div class="flag-icon">&#x1F1E8;&#x1F1E6;</div>
          <div class="country-name">Canada</div>
          <div class="progress-bar"><div class="progress-fill"></div></div>
        </div>
      </div>
    </div>

    <div class="branding">bionicbanker.tech</div>
  </div>

<script>
function sendHeight(){
  var h=Math.max(document.body.scrollHeight,document.body.offsetHeight,document.documentElement.scrollHeight);
  window.parent.postMessage({type:'iframeResize',height:h,src:location.pathname},'*');
}
window.addEventListener('load',function(){sendHeight();setTimeout(sendHeight,500);setTimeout(sendHeight,1500)});
window.addEventListener('resize',sendHeight);
new ResizeObserver(sendHeight).observe(document.body);
</script>
</body>
</html>
