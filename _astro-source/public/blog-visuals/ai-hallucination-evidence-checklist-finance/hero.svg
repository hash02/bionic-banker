<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AI hallucination evidence checklist for finance teams</title>
<desc id="desc">A black and green Bionic Banker control map showing AI answer to evidence packet.</desc>
<rect width="1600" height="900" fill="#050807"/>
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#00ff88" stop-opacity=".2"/><stop offset="1" stop-color="#9cffd0" stop-opacity=".05"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<path d="M0 130H1600M0 300H1600M0 470H1600M0 640H1600M0 810H1600M160 0V900M420 0V900M680 0V900M940 0V900M1200 0V900M1460 0V900" stroke="#123d2a" stroke-width="1" opacity=".45"/>
<text x="80" y="95" font-family="Inter, Arial, sans-serif" font-size="28" letter-spacing="4" fill="#7cffb6">BIONIC BANKER / CONTROL LAYER</text>
<text x="80" y="165" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#f4fff8">AI answer is not evidence.</text>
<text x="82" y="220" font-family="Inter, Arial, sans-serif" font-size="32" fill="#b8ffd9">Before finance teams rely on AI, turn claims into reviewable proof.</text>
<rect x="80" y="300" width="370" height="250" rx="26" fill="#08130e" stroke="#245c3e"/>
<text x="115" y="355" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">AI OUTPUT</text>
<text x="115" y="410" font-family="Inter, Arial, sans-serif" font-size="25" fill="#d7ffe8">Confident summary</text>
<text x="115" y="455" font-family="Inter, Arial, sans-serif" font-size="25" fill="#d7ffe8">Risk explanation</text>
<text x="115" y="500" font-family="Inter, Arial, sans-serif" font-size="25" fill="#d7ffe8">Policy interpretation</text>
<path d="M480 425H620" stroke="#00ff88" stroke-width="6" filter="url(#glow)"/><path d="M620 425l-28-18v36z" fill="#00ff88"/>
<rect x="650" y="260" width="360" height="350" rx="30" fill="url(#g)" stroke="#00ff88" stroke-width="3" filter="url(#glow)"/>
<text x="700" y="325" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">REVIEW GATES</text>
<text x="700" y="390" font-family="Inter, Arial, sans-serif" font-size="27" fill="#f4fff8">1. Exact claim</text>
<text x="700" y="440" font-family="Inter, Arial, sans-serif" font-size="27" fill="#f4fff8">2. Source trail</text>
<text x="700" y="490" font-family="Inter, Arial, sans-serif" font-size="27" fill="#f4fff8">3. Current + relevant</text>
<text x="700" y="540" font-family="Inter, Arial, sans-serif" font-size="27" fill="#f4fff8">4. Falsifier</text>
<path d="M1040 425H1180" stroke="#00ff88" stroke-width="6" filter="url(#glow)"/><path d="M1180 425l-28-18v36z" fill="#00ff88"/>
<rect x="1210" y="300" width="310" height="250" rx="26" fill="#08130e" stroke="#245c3e"/>
<text x="1245" y="355" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff">EVIDENCE PACKET</text>
<text x="1245" y="410" font-family="Inter, Arial, sans-serif" font-size="25" fill="#d7ffe8">Sources checked</text>
<text x="1245" y="455" font-family="Inter, Arial, sans-serif" font-size="25" fill="#d7ffe8">Reviewer decision</text>
<text x="1245" y="500" font-family="Inter, Arial, sans-serif" font-size="25" fill="#d7ffe8">Saved audit trail</text>
<rect x="80" y="705" width="1440" height="95" rx="22" fill="#0b1711" stroke="#183f2b"/>
<text x="120" y="765" font-family="Inter, Arial, sans-serif" font-size="33" font-weight="800" fill="#00ff88">Checklist:</text>
<text x="315" y="765" font-family="Inter, Arial, sans-serif" font-size="31" fill="#f4fff8">claim → source → freshness → relevance → falsifier → reviewer → trail</text>
</svg>
