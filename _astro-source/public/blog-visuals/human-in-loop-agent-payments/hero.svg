<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Human-in-the-loop control map for AI-agent payments</title>
<desc id="desc">A Bionic Banker diagram showing request, source trail, authority rule, payment proof, delivery check, exception review, and human approval.</desc>
<defs>
  <radialGradient id="bg" cx="20%" cy="12%" r="85%"><stop offset="0" stop-color="#103d28"/><stop offset="0.45" stop-color="#04120b"/><stop offset="1" stop-color="#010302"/></radialGradient>
  <linearGradient id="panel" x1="0" x2="1"><stop offset="0" stop-color="#092718"/><stop offset="1" stop-color="#05100a"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<g opacity=".22" stroke="#64ffad" stroke-width="1">
  <path d="M70 530 C280 380 360 210 570 240 S840 390 1110 170" fill="none"/>
  <path d="M100 150 C300 230 450 120 650 180 S880 320 1120 280" fill="none"/>
  <path d="M70 338 H1130"/>
</g>
<text x="70" y="82" fill="#eafff2" font-family="Inter,Arial,sans-serif" font-size="44" font-weight="800" letter-spacing="-1.4">Keep the human in the payment loop.</text>
<text x="72" y="124" fill="#a9ddbf" font-family="ui-monospace,Menlo,monospace" font-size="17">AI can prepare. Systems can execute. A human still owns the boundary.</text>
<g transform="translate(70 190)">
  <g fill="url(#panel)" stroke="#4fd98d" stroke-opacity=".45" stroke-width="1.3">
    <rect x="0" y="0" width="150" height="112" rx="18"/>
    <rect x="170" y="0" width="150" height="112" rx="18"/>
    <rect x="340" y="0" width="150" height="112" rx="18"/>
    <rect x="510" y="0" width="150" height="112" rx="18"/>
    <rect x="680" y="0" width="150" height="112" rx="18"/>
    <rect x="850" y="0" width="150" height="112" rx="18"/>
  </g>
  <g fill="#5cff9d" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="700">
    <text x="18" y="28">REQUEST</text><text x="188" y="28">SOURCE</text><text x="358" y="28">RULE</text><text x="528" y="28">PAYMENT</text><text x="698" y="28">DELIVERY</text><text x="868" y="28">REVIEW</text>
  </g>
  <g fill="#eafff2" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800">
    <text x="18" y="62">What was</text><text x="18" y="84">requested?</text>
    <text x="188" y="62">What proves</text><text x="188" y="84">the claim?</text>
    <text x="358" y="62">Was spend</text><text x="358" y="84">allowed?</text>
    <text x="528" y="62">What value</text><text x="528" y="84">moved?</text>
    <text x="698" y="62">What came</text><text x="698" y="84">back?</text>
    <text x="868" y="62">Who owns</text><text x="868" y="84">exceptions?</text>
  </g>
</g>
<g transform="translate(90 390)">
  <rect width="1020" height="155" rx="24" fill="#020906" stroke="#49d98b" stroke-opacity=".28"/>
  <text x="32" y="48" fill="#eafff2" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800">Tutorial frame</text>
  <text x="32" y="88" fill="#b9e7ca" font-family="Inter,Arial,sans-serif" font-size="21">Do not ask whether the agent is autonomous. Ask whether the payment can be replayed, reviewed, and reconciled.</text>
  <text x="32" y="124" fill="#5cff9d" font-family="ui-monospace,Menlo,monospace" font-size="16">simulate → source → authorize → execute → verify → human review</text>
</g>
<circle cx="1060" cy="106" r="44" fill="none" stroke="#5cff9d" stroke-width="2" opacity=".65" filter="url(#glow)"/>
<text x="1028" y="113" fill="#5cff9d" font-family="ui-monospace,Menlo,monospace" font-size="18" font-weight="800">BB</text>
</svg>
