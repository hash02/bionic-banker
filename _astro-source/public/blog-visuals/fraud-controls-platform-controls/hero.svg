<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Five-layer fraud control map</title>
  <desc id="desc">A green, black, and white Bionic Banker diagram showing transaction risk, account behavior, platform risk, counterparty infrastructure risk, and AI explanation risk.</desc>
  <rect width="1200" height="675" fill="#050806"/>
  <circle cx="1020" cy="100" r="240" fill="#0b2618" opacity="0.52"/>
  <circle cx="180" cy="610" r="280" fill="#082012" opacity="0.45"/>
  <g stroke="#174d2b" stroke-width="1" opacity="0.48">
    <path d="M80 110 H1120"/>
    <path d="M80 210 H1120"/>
    <path d="M80 310 H1120"/>
    <path d="M80 410 H1120"/>
    <path d="M80 510 H1120"/>
    <path d="M160 70 V585"/>
    <path d="M360 70 V585"/>
    <path d="M560 70 V585"/>
    <path d="M760 70 V585"/>
    <path d="M960 70 V585"/>
  </g>
  <text x="80" y="82" fill="#f5fff7" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700">Fraud controls are becoming platform controls</text>
  <text x="82" y="122" fill="#b9d9c2" font-family="Inter, Arial, sans-serif" font-size="20">source trail -> checked fact -> missing context -> human decision boundary</text>
  <g font-family="Inter, Arial, sans-serif">
    <g transform="translate(95 195)">
      <rect x="0" y="0" width="190" height="210" rx="24" fill="#07110b" stroke="#39d16f" stroke-width="2"/>
      <text x="24" y="45" fill="#39d16f" font-size="18" font-weight="700">01</text>
      <text x="24" y="82" fill="#f5fff7" font-size="24" font-weight="700">Transaction</text>
      <text x="24" y="116" fill="#b9d9c2" font-size="16">payment</text>
      <text x="24" y="143" fill="#b9d9c2" font-size="16">transfer</text>
      <text x="24" y="170" fill="#b9d9c2" font-size="16">claim event</text>
    </g>
    <g transform="translate(305 195)">
      <rect x="0" y="0" width="190" height="210" rx="24" fill="#07110b" stroke="#39d16f" stroke-width="2"/>
      <text x="24" y="45" fill="#39d16f" font-size="18" font-weight="700">02</text>
      <text x="24" y="82" fill="#f5fff7" font-size="24" font-weight="700">Account</text>
      <text x="24" y="116" fill="#b9d9c2" font-size="16">repeat patterns</text>
      <text x="24" y="143" fill="#b9d9c2" font-size="16">identity signals</text>
      <text x="24" y="170" fill="#b9d9c2" font-size="16">abuse loops</text>
    </g>
    <g transform="translate(515 195)">
      <rect x="0" y="0" width="190" height="210" rx="24" fill="#07110b" stroke="#39d16f" stroke-width="2"/>
      <text x="24" y="45" fill="#39d16f" font-size="18" font-weight="700">03</text>
      <text x="24" y="82" fill="#f5fff7" font-size="24" font-weight="700">Platform</text>
      <text x="24" y="116" fill="#b9d9c2" font-size="16">merchant risk</text>
      <text x="24" y="143" fill="#b9d9c2" font-size="16">network abuse</text>
      <text x="24" y="170" fill="#b9d9c2" font-size="16">off-rail context</text>
    </g>
    <g transform="translate(725 195)">
      <rect x="0" y="0" width="190" height="210" rx="24" fill="#07110b" stroke="#39d16f" stroke-width="2"/>
      <text x="24" y="45" fill="#39d16f" font-size="18" font-weight="700">04</text>
      <text x="24" y="82" fill="#f5fff7" font-size="24" font-weight="700">Counterparty</text>
      <text x="24" y="116" fill="#b9d9c2" font-size="16">wallets</text>
      <text x="24" y="143" fill="#b9d9c2" font-size="16">exchanges</text>
      <text x="24" y="170" fill="#b9d9c2" font-size="16">payment rails</text>
    </g>
    <g transform="translate(935 195)">
      <rect x="0" y="0" width="190" height="210" rx="24" fill="#0d1f13" stroke="#f5fff7" stroke-width="3"/>
      <text x="24" y="45" fill="#39d16f" font-size="18" font-weight="700">05</text>
      <text x="24" y="82" fill="#f5fff7" font-size="24" font-weight="700">AI explanation</text>
      <text x="24" y="116" fill="#b9d9c2" font-size="16">source used</text>
      <text x="24" y="143" fill="#b9d9c2" font-size="16">fact vs inference</text>
      <text x="24" y="170" fill="#b9d9c2" font-size="16">clear limit</text>
    </g>
  </g>
  <g fill="none" stroke="#39d16f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M286 300 H304"/>
    <path d="M496 300 H514"/>
    <path d="M706 300 H724"/>
    <path d="M916 300 H934"/>
  </g>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="235" y="485" width="730" height="72" rx="20" fill="#07110b" stroke="#2ea85b" stroke-width="2"/>
    <text x="270" y="530" fill="#f5fff7" font-size="24" font-weight="700">The AI summary is not the control. The visible source trail is.</text>
  </g>
</svg>
