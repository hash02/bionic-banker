<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Agentic payments receipt layer</title>
  <desc id="desc">A green and black finance-control flow showing source claim, payment request, authorization rule, transaction proof, delivery check, and human review.</desc>
  <rect width="1400" height="800" fill="#020503"/>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07140c"/>
      <stop offset="1" stop-color="#020503"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g opacity="0.18">
    <path d="M0 140H1400M0 260H1400M0 380H1400M0 500H1400M0 620H1400" stroke="#5cff9d" stroke-width="1"/>
    <path d="M120 0V800M320 0V800M520 0V800M720 0V800M920 0V800M1120 0V800M1320 0V800" stroke="#5cff9d" stroke-width="1"/>
  </g>
  <rect x="70" y="70" width="1260" height="660" rx="34" fill="url(#panel)" stroke="#5cff9d" stroke-width="2" opacity="0.96"/>
  <text x="120" y="145" fill="#f7fff9" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700">AI agents can pay now</text>
  <text x="120" y="198" fill="#b7f7c8" font-family="Inter, Arial, sans-serif" font-size="26">The control gap is the receipt layer.</text>
  <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <g transform="translate(170 330)">
      <circle r="58" fill="#061109" stroke="#5cff9d" stroke-width="3" filter="url(#glow)"/>
      <text y="-8" fill="#f7fff9">source</text><text y="18" fill="#f7fff9">claim</text>
    </g>
    <g transform="translate(380 330)">
      <circle r="58" fill="#061109" stroke="#5cff9d" stroke-width="3"/>
      <text y="-8" fill="#f7fff9">payment</text><text y="18" fill="#f7fff9">request</text>
    </g>
    <g transform="translate(590 330)">
      <circle r="58" fill="#061109" stroke="#5cff9d" stroke-width="3"/>
      <text y="-8" fill="#f7fff9">authority</text><text y="18" fill="#f7fff9">rule</text>
    </g>
    <g transform="translate(800 330)">
      <circle r="58" fill="#061109" stroke="#5cff9d" stroke-width="3"/>
      <text y="-8" fill="#f7fff9">payment</text><text y="18" fill="#f7fff9">proof</text>
    </g>
    <g transform="translate(1010 330)">
      <circle r="58" fill="#061109" stroke="#5cff9d" stroke-width="3"/>
      <text y="-8" fill="#f7fff9">delivery</text><text y="18" fill="#f7fff9">check</text>
    </g>
    <g transform="translate(1220 330)">
      <circle r="58" fill="#061109" stroke="#f7fff9" stroke-width="3"/>
      <text y="-8" fill="#f7fff9">human</text><text y="18" fill="#f7fff9">review</text>
    </g>
  </g>
  <g stroke="#5cff9d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232 330H318"/><path d="M442 330H528"/><path d="M652 330H738"/><path d="M862 330H948"/><path d="M1072 330H1158"/>
    <path d="M306 318l16 12-16 12M516 318l16 12-16 12M726 318l16 12-16 12M936 318l16 12-16 12M1146 318l16 12-16 12"/>
  </g>
  <rect x="150" y="470" width="1100" height="150" rx="26" fill="#020503" stroke="#214d31" stroke-width="2"/>
  <text x="190" y="525" fill="#f7fff9" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700">Finance question</text>
  <text x="190" y="570" fill="#b7f7c8" font-family="Inter, Arial, sans-serif" font-size="25">Can a reviewer see why the agent paid, what it received, and what the record cannot prove?</text>
  <text x="120" y="690" fill="#7ee8a5" font-family="Inter, Arial, sans-serif" font-size="18">Bionic Banker | source trail - checked fact - missing context - clear limit - human next question</text>
</svg>
