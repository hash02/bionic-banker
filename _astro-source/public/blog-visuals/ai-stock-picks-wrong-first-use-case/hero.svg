<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AI finance decision review map</title>
  <desc id="desc">A dark Bionic Banker editorial hero showing the safer AI finance workflow from source to human decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020604"/>
      <stop offset="0.55" stop-color="#07140e"/>
      <stop offset="1" stop-color="#020604"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#00ff88" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <style>
      .label{font:700 34px Inter,Segoe UI,Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;fill:#87ffbd}
      .title{font:800 72px Inter,Segoe UI,Arial,sans-serif;fill:#f5fff8}
      .body{font:500 34px Inter,Segoe UI,Arial,sans-serif;fill:#d8fbe4}
      .small{font:600 25px Inter,Segoe UI,Arial,sans-serif;fill:#a9dcbc}
      .node{fill:#071b11;stroke:#28ff93;stroke-width:3;filter:url(#shadow)}
      .danger{fill:#1d090b;stroke:#ff6b7a;stroke-width:3;filter:url(#shadow)}
      .arrow{stroke:#36ffa0;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;fill:none;marker-end:url(#arrow)}
      .grid{stroke:#123522;stroke-width:1;opacity:.5}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10" fill="#36ffa0"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g opacity="0.5">
    <path class="grid" d="M120 0v900M280 0v900M440 0v900M600 0v900M760 0v900M920 0v900M1080 0v900M1240 0v900M1400 0v900"/>
    <path class="grid" d="M0 120h1600M0 260h1600M0 400h1600M0 540h1600M0 680h1600M0 820h1600"/>
  </g>

  <text x="110" y="115" class="label">Bionic Banker / AI + Finance</text>
  <text x="110" y="205" class="title">Don’t ask AI what to buy.</text>
  <text x="110" y="280" class="title">Ask what you are missing.</text>
  <text x="112" y="340" class="body">A safer finance workflow keeps sources, assumptions, risks, and authority visible.</text>

  <g transform="translate(110 430)">
    <rect class="danger" x="0" y="0" width="520" height="150" rx="28"/>
    <text x="36" y="58" class="small" fill="#ffc2c8">Dangerous first prompt</text>
    <text x="36" y="113" class="body" fill="#fff0f2">“What should I buy?”</text>
    <text x="36" y="190" class="small">false confidence · missing context · authority drift</text>
  </g>

  <g transform="translate(930 430)">
    <rect class="node" x="0" y="0" width="560" height="150" rx="28"/>
    <text x="36" y="58" class="small">Safer first prompt</text>
    <text x="36" y="113" class="body">“What am I missing?”</text>
    <text x="36" y="190" class="small">sources · assumptions · risks · human decision</text>
  </g>

  <path class="arrow" d="M650 505 C730 455, 805 455, 900 505"/>

  <g transform="translate(110 710)">
    <rect class="node" x="0" y="0" width="185" height="78" rx="20"/><text x="35" y="50" class="small">Source</text>
    <rect class="node" x="220" y="0" width="185" height="78" rx="20"/><text x="252" y="50" class="small">Summary</text>
    <rect class="node" x="440" y="0" width="220" height="78" rx="20"/><text x="474" y="50" class="small">Assumptions</text>
    <rect class="node" x="695" y="0" width="150" height="78" rx="20"/><text x="734" y="50" class="small">Risks</text>
    <rect class="node" x="880" y="0" width="250" height="78" rx="20"/><text x="918" y="50" class="small">Missing context</text>
    <rect class="node" x="1165" y="0" width="260" height="78" rx="20"/><text x="1205" y="50" class="small">Human decision</text>
    <path class="arrow" d="M190 39h25M410 39h25M665 39h25M850 39h25M1135 39h25"/>
  </g>

  <text x="110" y="855" class="small">Educational only. Not investment, legal, or tax advice. bionicbanker.tech</text>
</svg>
