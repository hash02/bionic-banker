<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agentic AI authority governance in finance</title>
  <desc id="desc">A dark green Bionic Banker diagram showing the shift from AI tool governance to authority governance.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#020604"/>
      <stop offset="0.58" stop-color="#06120c"/>
      <stop offset="1" stop-color="#0b1a12"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" x2="1">
      <stop offset="0" stop-color="#32d583"/>
      <stop offset="1" stop-color="#d6f5e5"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#123023" stroke-width="1" opacity="0.62"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.52"/>
  <circle cx="1285" cy="170" r="280" fill="#1fa068" opacity="0.08"/>
  <circle cx="250" cy="770" r="345" fill="#8fdcb0" opacity="0.055"/>

  <g font-family="Inter, ui-sans-serif, system-ui">
    <text x="96" y="116" fill="#f5fff8" font-size="64" font-weight="850">Agentic AI needs</text>
    <text x="96" y="188" fill="#f5fff8" font-size="64" font-weight="850">authority governance</text>
    <text x="100" y="244" fill="#a9cbb8" font-size="29">Finance must govern agent permissions, not only AI tools.</text>
  </g>

  <g transform="translate(105 315)" font-family="Inter, ui-sans-serif, system-ui">
    <rect x="0" y="0" width="395" height="245" rx="30" fill="#031008" stroke="#1f6f4a" stroke-width="2.5"/>
    <text x="42" y="62" fill="#32d583" font-size="30" font-weight="850">TOOL GOVERNANCE</text>
    <text x="42" y="116" fill="#f5fff8" font-size="36" font-weight="820">Which platform?</text>
    <text x="42" y="170" fill="#a9cbb8" font-size="27">vendor · data · users</text>

    <path d="M450 123 H625" stroke="url(#rail)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
    <polygon points="625,123 584,100 584,146" fill="#d6f5e5"/>
    <text x="454" y="88" fill="#d6f5e5" font-size="28" font-weight="820">agentic shift</text>

    <rect x="690" y="-35" width="770" height="315" rx="36" fill="#04100a" stroke="#32d583" stroke-width="3"/>
    <text x="735" y="32" fill="#f5fff8" font-size="39" font-weight="850">AUTHORITY GOVERNANCE</text>
    <text x="735" y="82" fill="#32d583" font-size="29" font-weight="760">What can the agent do?</text>

    <g fill="#e8fff1" font-size="31" font-weight="720">
      <text x="735" y="148">01 Decide</text>
      <text x="1008" y="148">02 Touch systems</text>
      <text x="735" y="206">03 Keep evidence</text>
      <text x="1008" y="206">04 Escalate</text>
      <text x="735" y="264">05 Pause or stop</text>
      <text x="1008" y="264">06 Own outcome</text>
    </g>
  </g>

  <g transform="translate(105 660)" font-family="Inter, ui-sans-serif, system-ui">
    <rect width="1390" height="128" rx="30" fill="#020604" opacity="0.82" stroke="#1f6f4a"/>
    <text x="42" y="53" fill="#e8fff1" font-size="32" font-weight="850">The control question:</text>
    <text x="42" y="98" fill="#32d583" font-size="37" font-weight="850">What is this agent allowed to do — and where must it stop?</text>
  </g>

  <text x="108" y="850" fill="#749982" font-family="Inter, ui-sans-serif, system-ui" font-size="22">Bionic Banker · AI governance, financial stability, and controlled autonomy</text>
</svg>