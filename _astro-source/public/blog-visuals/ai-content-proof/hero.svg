<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI content proof workflow</title>
  <desc id="desc">A dark Bionic Banker diagram showing claim, source, boundary, artifact, and text polish.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.55" stop-color="#0b111c"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.29 0 0 0 0 0.75 0 0 0 0 0.98 0 0 0 .35 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1040" cy="110" r="220" fill="#0ea5e9" opacity="0.08"/>
  <circle cx="140" cy="540" r="190" fill="#22c55e" opacity="0.07"/>

  <text x="72" y="88" fill="#93c5fd" font-family="Inter, Arial, sans-serif" font-size="22" letter-spacing="4">BIONIC BANKER</text>
  <text x="72" y="152" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="54">AI content fails when</text>
  <text x="72" y="214" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-weight="800" font-size="54">it has nothing to prove</text>
  <text x="74" y="262" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="23">Start with evidence. Use models for polish.</text>

  <g transform="translate(72 330)">
    <rect width="232" height="142" rx="24" fill="url(#card)" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="26" y="48" fill="#38bdf8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">01 CLAIM</text>
    <text x="26" y="86" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">What do we</text>
    <text x="26" y="116" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">actually think?</text>
  </g>
  <g transform="translate(342 330)">
    <rect width="232" height="142" rx="24" fill="url(#card)" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="26" y="48" fill="#a78bfa" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">02 SOURCE</text>
    <text x="26" y="86" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">What record</text>
    <text x="26" y="116" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">supports it?</text>
  </g>
  <g transform="translate(612 330)">
    <rect width="232" height="142" rx="24" fill="url(#card)" stroke="#f59e0b" stroke-opacity="0.5"/>
    <text x="26" y="48" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">03 BOUNDARY</text>
    <text x="26" y="86" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">What are we</text>
    <text x="26" y="116" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">not claiming?</text>
  </g>
  <g transform="translate(882 330)">
    <rect width="232" height="142" rx="24" fill="url(#card)" stroke="#22c55e" stroke-opacity="0.5"/>
    <text x="26" y="48" fill="#4ade80" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">04 ARTIFACT</text>
    <text x="26" y="86" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">What does the</text>
    <text x="26" y="116" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">reader keep?</text>
  </g>

  <path d="M304 401h38M574 401h38M844 401h38" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#glow)">
    <rect x="386" y="526" width="428" height="58" rx="29" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="431" y="563" fill="#dbeafe" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">LLM role: edit, compress, verify</text>
  </g>
</svg>
