<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Public wallet watch source to review question flow</title>
  <desc id="desc">An infographic showing public source, label and context, movement category, AML review question, missing context, and clear limits.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#031008"/>
      <stop offset="0.55" stop-color="#06170d"/>
      <stop offset="1" stop-color="#020403"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .bg { fill: url(#bg); }
      .grid { stroke: rgba(74, 222, 128, 0.10); stroke-width: 1; }
      .line { stroke: #1fa068; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 10 12; }
      .card { fill: rgba(255,255,255,0.045); stroke: rgba(74,222,128,0.38); stroke-width: 1.4; rx: 18; }
      .num { fill: #9cffc4; font: 700 18px Inter, Arial, sans-serif; letter-spacing: .08em; }
      .label { fill: #e8fff0; font: 700 24px Inter, Arial, sans-serif; }
      .copy { fill: #b8cfc0; font: 16px Inter, Arial, sans-serif; }
      .small { fill: #80a98f; font: 13px Inter, Arial, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
      .title { fill: #ffffff; font: 800 38px Inter, Arial, sans-serif; }
      .subtitle { fill: #b8cfc0; font: 18px Inter, Arial, sans-serif; }
      .limit { fill: rgba(255,255,255,0.035); stroke: rgba(255,255,255,0.18); stroke-width: 1.2; rx: 14; }
      .limitText { fill: #e8fff0; font: 700 17px Inter, Arial, sans-serif; }
    </style>
  </defs>
  <rect class="bg" width="1200" height="560"/>
  <g opacity="0.8">
    <path class="grid" d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M120 0V560M240 0V560M360 0V560M480 0V560M600 0V560M720 0V560M840 0V560M960 0V560M1080 0V560"/>
  </g>
  <text class="small" x="64" y="62">BIONIC BANKER · PUBLIC WALLET WATCH</text>
  <text class="title" x="64" y="112">Source trail before interpretation</text>
  <text class="subtitle" x="64" y="145">A wallet row becomes useful only after the source, missing context, and clear limit stay visible.</text>

  <path class="line" d="M122 292C240 250 320 340 438 292S640 250 758 292S960 340 1078 292" filter="url(#glow)"/>

  <g transform="translate(64 205)">
    <rect class="card" width="164" height="142"/>
    <text class="num" x="18" y="35">01</text>
    <text class="label" x="18" y="72">Source</text>
    <text class="copy" x="18" y="102">Explorer page,</text>
    <text class="copy" x="18" y="124">public label, timestamp</text>
  </g>
  <g transform="translate(250 205)">
    <rect class="card" width="164" height="142"/>
    <text class="num" x="18" y="35">02</text>
    <text class="label" x="18" y="72">Context</text>
    <text class="copy" x="18" y="102">Known label,</text>
    <text class="copy" x="18" y="124">counterparty pattern</text>
  </g>
  <g transform="translate(436 205)">
    <rect class="card" width="164" height="142"/>
    <text class="num" x="18" y="35">03</text>
    <text class="label" x="18" y="72">Activity</text>
    <text class="copy" x="18" y="102">Movement category,</text>
    <text class="copy" x="18" y="124">not a signal</text>
  </g>
  <g transform="translate(622 205)">
    <rect class="card" width="164" height="142"/>
    <text class="num" x="18" y="35">04</text>
    <text class="label" x="18" y="72">Question</text>
    <text class="copy" x="18" y="102">AML review angle,</text>
    <text class="copy" x="18" y="124">not accusation</text>
  </g>
  <g transform="translate(808 205)">
    <rect class="card" width="164" height="142"/>
    <text class="num" x="18" y="35">05</text>
    <text class="label" x="18" y="72">Missing</text>
    <text class="copy" x="18" y="102">Purpose, owner,</text>
    <text class="copy" x="18" y="124">off-chain context</text>
  </g>
  <g transform="translate(994 205)">
    <rect class="card" width="142" height="142"/>
    <text class="num" x="18" y="35">06</text>
    <text class="label" x="18" y="72">Limit</text>
    <text class="copy" x="18" y="102">No trade, wallet,</text>
    <text class="copy" x="18" y="124">or filing authority</text>
  </g>

  <rect class="limit" x="64" y="405" width="1072" height="76"/>
  <text class="limitText" x="92" y="438">Reader rule: show the source, show the question, show what the system cannot decide.</text>
  <text class="copy" x="92" y="464">This is an educational source record. It is not investment advice, KYC approval, compliance filing, wallet control, or a direction to copy a wallet.</text>
</svg>
