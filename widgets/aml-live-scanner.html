<!--
  AML Live Scanner Widget — Embeddable 3D visualization
  Drop this into any bionicbanker.tech page.
  Shows a rotating network of transaction nodes that pulse on "detection."
-->
<div id="aml-widget" style="width:100%;height:400px;position:relative;background:#000;border-radius:12px;overflow:hidden;border:1px solid rgba(31,160,104,0.15);">
  <canvas id="aml-canvas"></canvas>
  <div style="position:absolute;top:20px;left:24px;z-index:10;font-family:'JetBrains Mono',monospace;">
    <div style="font-size:11px;color:#1fa068;letter-spacing:2px;text-transform:uppercase;">NEXUS-RISK v12</div>
    <div style="font-size:24px;font-weight:800;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;margin-top:4px;">Live AML Scanner</div>
    <div style="font-size:12px;color:#666;margin-top:4px;">28 rules · 7 chains · 94.9% detection</div>
  </div>
  <div id="aml-stats" style="position:absolute;bottom:16px;left:24px;z-index:10;display:flex;gap:24px;font-family:'JetBrains Mono',monospace;">
    <div><span style="font-size:20px;font-weight:800;color:#1fa068;" id="tx-count">0</span><div style="font-size:9px;color:#555;margin-top:2px;">SCANNED</div></div>
    <div><span style="font-size:20px;font-weight:800;color:#ff4444;" id="alert-count">0</span><div style="font-size:9px;color:#555;margin-top:2px;">ALERTS</div></div>
    <div><span style="font-size:20px;font-weight:800;color:#2dd47a;" id="clean-count">0</span><div style="font-size:9px;color:#555;margin-top:2px;">CLEAN</div></div>
  </div>
  <div style="position:absolute;bottom:16px;right:24px;z-index:10;font-size:10px;color:#333;font-family:'JetBrains Mono',monospace;">bionicbanker.tech</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  const container = document.getElementById('aml-widget');
  const canvas = document.getElementById('aml-canvas');
  const w = container.offsetWidth, h = container.offsetHeight;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 100);
  camera.position.set(0, 2, 6);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x000000);

  // Transaction nodes
  const nodes = [];
  const nodeGeo = new THREE.SphereGeometry(0.06, 8, 8);
  const greenMat = new THREE.MeshBasicMaterial({ color: 0x1fa068 });
  const redMat = new THREE.MeshBasicMaterial({ color: 0xff4444 });
  const brightMat = new THREE.MeshBasicMaterial({ color: 0x2dd47a });

  for (let i = 0; i < 60; i++) {
    const mat = Math.random() > 0.9 ? redMat : (Math.random() > 0.6 ? brightMat : greenMat);
    const node = new THREE.Mesh(nodeGeo, mat);
    node.position.set(
      (Math.random() - 0.5) * 8,
      (Math.random() - 0.5) * 4,
      (Math.random() - 0.5) * 6
    );
    node.userData = {
      vx: (Math.random() - 0.5) * 0.003,
      vy: (Math.random() - 0.5) * 0.003,
      vz: (Math.random() - 0.5) * 0.003,
      isAlert: mat === redMat,
      pulse: Math.random() * Math.PI * 2,
    };
    scene.add(node);
    nodes.push(node);
  }

  // Connection lines
  const lineMat = new THREE.LineBasicMaterial({ color: 0x1fa068, transparent: true, opacity: 0.12 });
  const lineGroup = new THREE.Group();
  scene.add(lineGroup);

  // Ambient dust
  const dustGeo = new THREE.BufferGeometry();
  const dustPos = new Float32Array(300 * 3);
  for (let i = 0; i < 300; i++) {
    dustPos[i*3] = (Math.random()-0.5)*12;
    dustPos[i*3+1] = (Math.random()-0.5)*8;
    dustPos[i*3+2] = (Math.random()-0.5)*10;
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
  scene.add(new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0x1fa068, size: 0.015, transparent: true, opacity: 0.15 })));

  // Counters
  let txCount = 0, alertCount = 0, cleanCount = 0;
  const txEl = document.getElementById('tx-count');
  const alertEl = document.getElementById('alert-count');
  const cleanEl = document.getElementById('clean-count');

  function updateLines() {
    lineGroup.clear();
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        if (nodes[i].position.distanceTo(nodes[j].position) < 1.8) {
          const geo = new THREE.BufferGeometry().setFromPoints([nodes[i].position, nodes[j].position]);
          lineGroup.add(new THREE.Line(geo, lineMat));
        }
      }
    }
  }

  // Simulate transaction scanning
  setInterval(() => {
    txCount++;
    if (Math.random() > 0.85) { alertCount++; } else { cleanCount++; }
    txEl.textContent = txCount;
    alertEl.textContent = alertCount;
    cleanEl.textContent = cleanCount;
  }, 800);

  let t = 0;
  function animate() {
    t += 0.016;
    nodes.forEach(n => {
      n.position.x += n.userData.vx;
      n.position.y += n.userData.vy;
      n.position.z += n.userData.vz;
      if (Math.abs(n.position.x) > 4) n.userData.vx *= -1;
      if (Math.abs(n.position.y) > 2) n.userData.vy *= -1;
      if (Math.abs(n.position.z) > 3) n.userData.vz *= -1;

      // Pulse alert nodes
      if (n.userData.isAlert) {
        n.scale.setScalar(1 + Math.sin(t * 4 + n.userData.pulse) * 0.4);
      }
    });
    if (Math.floor(t * 60) % 45 === 0) updateLines();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  updateLines();
  animate();

  // Resize
  window.addEventListener('resize', () => {
    const nw = container.offsetWidth, nh = container.offsetHeight;
    camera.aspect = nw / nh;
    camera.updateProjectionMatrix();
    renderer.setSize(nw, nh);
  });
})();
</script>
