<!DOCTYPE html>
<html lang="en">
<head><style>body,html{background:#08080e!important}canvas,canvas.vanta-canvas{background:#08080e!important}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bionic Banker - 3D Blockchain Node Graph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }
  .title {
    position: fixed; top: 2rem; left: 2rem; z-index: 10;
    color: #fff; pointer-events: none;
  }
  .title h2 { font-size: 1.5rem; color: #1fa068; letter-spacing: 0.1em; }
  .title p { font-size: 0.8rem; color: rgba(255,255,255,0.4); margin-top: 0.3rem; }
  .legend {
    position: fixed; bottom: 2rem; right: 2rem; z-index: 10;
    color: rgba(255,255,255,0.5); font-size: 0.7rem; pointer-events: none;
  }
  .legend div { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.3rem; }
  .legend .dot { width: 8px; height: 8px; border-radius: 50%; }
</style>
</head>
<body>
<div class="title">
  <h2>BLOCKCHAIN NETWORK GRAPH</h2>
  <p>Real-time transaction flow visualization</p>
</div>
<div class="legend">
  <div><span class="dot" style="background:#1fa068"></span> Verified Node</div>
  <div><span class="dot" style="background:#ff6b6b"></span> Flagged (AML Alert)</div>
  <div><span class="dot" style="background:#4ecdc4"></span> Smart Contract</div>
  <div><span class="dot" style="background:#f9d923"></span> Exchange</div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a0a);
scene.fog = new THREE.FogExp2(0x0a0a0a, 0.02);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 15, 35);

const GREEN = 0x1fa068;
const RED = 0xff6b6b;
const CYAN = 0x4ecdc4;
const YELLOW = 0xf9d923;

// --- Generate network nodes ---
const nodeTypes = [
  { color: GREEN, count: 25, label: 'verified' },
  { color: RED, count: 5, label: 'flagged' },
  { color: CYAN, count: 8, label: 'contract' },
  { color: YELLOW, count: 4, label: 'exchange' }
];

const nodes = [];
const nodeGroup = new THREE.Group();

nodeTypes.forEach(type => {
  for (let i = 0; i < type.count; i++) {
    const geo = type.label === 'exchange'
      ? new THREE.OctahedronGeometry(0.5)
      : type.label === 'contract'
        ? new THREE.BoxGeometry(0.6, 0.6, 0.6)
        : new THREE.SphereGeometry(0.3, 16, 16);
    const mat = new THREE.MeshPhongMaterial({
      color: type.color,
      emissive: new THREE.Color(type.color).multiplyScalar(0.3),
      transparent: true, opacity: 0.9
    });
    const mesh = new THREE.Mesh(geo, mat);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 8 + Math.random() * 15;
    mesh.position.set(
      r * Math.sin(phi) * Math.cos(theta),
      (Math.random() - 0.5) * 15,
      r * Math.sin(phi) * Math.sin(theta)
    );
    mesh.userData = {
      type: type.label, color: type.color,
      baseY: mesh.position.y, phase: Math.random() * Math.PI * 2,
      pulseSpeed: 1 + Math.random() * 2
    };

    // Glow sphere
    const glowGeo = new THREE.SphereGeometry(0.6, 8, 8);
    const glowMat = new THREE.MeshBasicMaterial({
      color: type.color, transparent: true, opacity: 0.15,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const glow = new THREE.Mesh(glowGeo, glowMat);
    mesh.add(glow);

    nodes.push(mesh);
    nodeGroup.add(mesh);
  }
});
scene.add(nodeGroup);

// --- Create edges between nodes ---
const edgeGroup = new THREE.Group();
const edges = [];
for (let i = 0; i < nodes.length; i++) {
  const connections = 1 + Math.floor(Math.random() * 3);
  for (let c = 0; c < connections; c++) {
    const j = Math.floor(Math.random() * nodes.length);
    if (i === j) continue;
    const points = [nodes[i].position.clone(), nodes[j].position.clone()];
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const isFlagged = nodes[i].userData.type === 'flagged' || nodes[j].userData.type === 'flagged';
    const mat = new THREE.LineBasicMaterial({
      color: isFlagged ? RED : GREEN,
      transparent: true, opacity: isFlagged ? 0.3 : 0.08,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const line = new THREE.Line(geo, mat);
    line.userData = { from: i, to: j };
    edges.push(line);
    edgeGroup.add(line);
  }
}
scene.add(edgeGroup);

// --- Transaction pulse particles ---
const pulseCount = 30;
const pulses = [];
for (let i = 0; i < pulseCount; i++) {
  const edge = edges[Math.floor(Math.random() * edges.length)];
  const geo = new THREE.SphereGeometry(0.08, 4, 4);
  const mat = new THREE.MeshBasicMaterial({
    color: GREEN, blending: THREE.AdditiveBlending,
    transparent: true, opacity: 0.8
  });
  const pulse = new THREE.Mesh(geo, mat);
  pulse.userData = {
    edge: edge.userData, progress: Math.random(),
    speed: 0.002 + Math.random() * 0.005
  };
  pulses.push(pulse);
  scene.add(pulse);
}

// --- Lights ---
scene.add(new THREE.AmbientLight(0x222222));
const light1 = new THREE.PointLight(GREEN, 2, 60);
light1.position.set(10, 10, 10);
scene.add(light1);
const light2 = new THREE.PointLight(CYAN, 1, 60);
light2.position.set(-10, -10, -10);
scene.add(light2);

// --- Mouse ---
const mouse = { x: 0, y: 0 };
document.addEventListener('mousemove', e => {
  mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
  mouse.y = (e.clientY / window.innerHeight - 0.5) * 2;
});

// --- Animate ---
function animate(time) {
  requestAnimationFrame(animate);
  const t = time * 0.001;

  // Float nodes
  nodes.forEach(node => {
    node.position.y = node.userData.baseY + Math.sin(t * node.userData.pulseSpeed + node.userData.phase) * 0.5;
    node.rotation.y += 0.005;
    // Pulse glow for flagged
    if (node.userData.type === 'flagged') {
      node.children[0].material.opacity = 0.15 + Math.sin(t * 4) * 0.1;
      node.children[0].scale.setScalar(1 + Math.sin(t * 4) * 0.3);
    }
  });

  // Update edge positions
  edges.forEach(edge => {
    const posArr = edge.geometry.attributes.position.array;
    const from = nodes[edge.userData.from].position;
    const to = nodes[edge.userData.to].position;
    posArr[0] = from.x; posArr[1] = from.y; posArr[2] = from.z;
    posArr[3] = to.x; posArr[4] = to.y; posArr[5] = to.z;
    edge.geometry.attributes.position.needsUpdate = true;
  });

  // Animate pulses along edges
  pulses.forEach(pulse => {
    pulse.userData.progress += pulse.userData.speed;
    if (pulse.userData.progress > 1) {
      pulse.userData.progress = 0;
      const newEdge = edges[Math.floor(Math.random() * edges.length)];
      pulse.userData.edge = newEdge.userData;
    }
    const from = nodes[pulse.userData.edge.from].position;
    const to = nodes[pulse.userData.edge.to].position;
    const p = pulse.userData.progress;
    pulse.position.lerpVectors(from, to, p);
  });

  // Rotate whole scene slowly + mouse influence
  nodeGroup.rotation.y = t * 0.05 + mouse.x * 0.3;
  edgeGroup.rotation.y = nodeGroup.rotation.y;
  camera.position.y = 15 - mouse.y * 5;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
animate(0);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
