<!DOCTYPE html>
<html lang="en">
<head><style>body,html{background:#08080e!important}canvas,canvas.vanta-canvas{background:#08080e!important}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bionic Banker - 3D Hero Section</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  #canvas { position: fixed; top: 0; left: 0; z-index: 0; }
  .overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1; display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    pointer-events: none;
  }
  .overlay h1 {
    font-size: 4rem; color: #fff; letter-spacing: 0.1em;
    text-shadow: 0 0 40px rgba(31,160,104,0.5);
    margin-bottom: 0.5rem;
  }
  .overlay h1 span { color: #1fa068; }
  .overlay p {
    font-size: 1.2rem; color: rgba(255,255,255,0.6);
    letter-spacing: 0.3em; text-transform: uppercase;
  }
  .stats {
    display: flex; gap: 3rem; margin-top: 2rem;
  }
  .stat { text-align: center; }
  .stat .num { font-size: 2rem; color: #1fa068; font-weight: bold; }
  .stat .label { font-size: 0.75rem; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.15em; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="overlay">
  <h1>BIONIC <span>BANKER</span></h1>
  <p>Where Finance Meets the Future</p>
  <div class="stats">
    <div class="stat"><div class="num">28</div><div class="label">Articles</div></div>
    <div class="stat"><div class="num">3</div><div class="label">Live Projects</div></div>
    <div class="stat"><div class="num">5+</div><div class="label">Years</div></div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0a, 0.035);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0, 30);

// Brand color
const GREEN = new THREE.Color(31/255, 160/255, 104/255);
const DARK_GREEN = new THREE.Color(15/255, 80/255, 52/255);

// --- Central Icosahedron (represents the "bionic" core) ---
const icoGeo = new THREE.IcosahedronGeometry(3, 1);
const icoMat = new THREE.MeshPhongMaterial({
  color: GREEN, emissive: DARK_GREEN, wireframe: true,
  transparent: true, opacity: 0.8
});
const ico = new THREE.Mesh(icoGeo, icoMat);
scene.add(ico);

// Inner solid core
const coreGeo = new THREE.IcosahedronGeometry(1.5, 2);
const coreMat = new THREE.MeshPhongMaterial({
  color: GREEN, emissive: DARK_GREEN,
  transparent: true, opacity: 0.3, shininess: 100
});
const core = new THREE.Mesh(coreGeo, coreMat);
scene.add(core);

// --- Orbiting rings (data flow) ---
const rings = [];
for (let i = 0; i < 3; i++) {
  const ringGeo = new THREE.TorusGeometry(5 + i * 1.5, 0.02, 8, 100);
  const ringMat = new THREE.MeshBasicMaterial({
    color: GREEN, transparent: true, opacity: 0.3 - i * 0.08
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 3 + i * 0.4;
  ring.rotation.y = i * 0.7;
  rings.push(ring);
  scene.add(ring);
}

// --- Floating particles (network nodes) ---
const particleCount = 500;
const positions = new Float32Array(particleCount * 3);
const velocities = [];
for (let i = 0; i < particleCount; i++) {
  positions[i * 3] = (Math.random() - 0.5) * 60;
  positions[i * 3 + 1] = (Math.random() - 0.5) * 60;
  positions[i * 3 + 2] = (Math.random() - 0.5) * 60;
  velocities.push({
    x: (Math.random() - 0.5) * 0.02,
    y: (Math.random() - 0.5) * 0.02,
    z: (Math.random() - 0.5) * 0.02
  });
}
const particleGeo = new THREE.BufferGeometry();
particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
const particleMat = new THREE.PointsMaterial({
  color: GREEN, size: 0.15, transparent: true, opacity: 0.6,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const particles = new THREE.Points(particleGeo, particleMat);
scene.add(particles);

// --- Connection lines between nearby particles ---
const lineGeo = new THREE.BufferGeometry();
const linePositions = new Float32Array(particleCount * 6);
lineGeo.setAttribute('position', new THREE.BufferAttribute(linePositions, 3));
const lineMat = new THREE.LineBasicMaterial({
  color: GREEN, transparent: true, opacity: 0.1,
  blending: THREE.AdditiveBlending, depthWrite: false
});
const lines = new THREE.LineSegments(lineGeo, lineMat);
scene.add(lines);

// --- Floating data cubes (blockchain blocks) ---
const cubes = [];
for (let i = 0; i < 12; i++) {
  const size = 0.3 + Math.random() * 0.4;
  const cubeGeo = new THREE.BoxGeometry(size, size, size);
  const cubeMat = new THREE.MeshPhongMaterial({
    color: GREEN, emissive: DARK_GREEN, wireframe: Math.random() > 0.5,
    transparent: true, opacity: 0.5
  });
  const cube = new THREE.Mesh(cubeGeo, cubeMat);
  cube.position.set(
    (Math.random() - 0.5) * 25,
    (Math.random() - 0.5) * 25,
    (Math.random() - 0.5) * 25
  );
  cube.userData = {
    rotSpeed: { x: Math.random() * 0.02, y: Math.random() * 0.02 },
    orbitSpeed: 0.001 + Math.random() * 0.003,
    orbitRadius: 8 + Math.random() * 12,
    orbitOffset: Math.random() * Math.PI * 2,
    yOffset: (Math.random() - 0.5) * 15
  };
  cubes.push(cube);
  scene.add(cube);
}

// --- Lights ---
const ambient = new THREE.AmbientLight(0x111111);
scene.add(ambient);
const pointLight = new THREE.PointLight(GREEN, 2, 50);
pointLight.position.set(5, 5, 10);
scene.add(pointLight);
const pointLight2 = new THREE.PointLight(0x1fa068, 1, 50);
pointLight2.position.set(-10, -5, -10);
scene.add(pointLight2);

// --- Mouse tracking ---
const mouse = { x: 0, y: 0 };
document.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth - 0.5) * 2;
  mouse.y = (e.clientY / window.innerHeight - 0.5) * 2;
});

// --- Animation loop ---
function animate(time) {
  requestAnimationFrame(animate);
  const t = time * 0.001;

  // Rotate central shape
  ico.rotation.x = t * 0.3 + mouse.y * 0.3;
  ico.rotation.y = t * 0.2 + mouse.x * 0.3;
  core.rotation.x = -t * 0.2;
  core.rotation.y = -t * 0.3;

  // Pulse core
  const pulse = 1 + Math.sin(t * 2) * 0.1;
  core.scale.set(pulse, pulse, pulse);
  coreMat.opacity = 0.2 + Math.sin(t * 3) * 0.1;

  // Rotate rings
  rings.forEach((ring, i) => {
    ring.rotation.z = t * (0.1 + i * 0.05);
    ring.rotation.x += 0.001;
  });

  // Move particles
  const pos = particleGeo.attributes.position.array;
  for (let i = 0; i < particleCount; i++) {
    pos[i * 3] += velocities[i].x;
    pos[i * 3 + 1] += velocities[i].y;
    pos[i * 3 + 2] += velocities[i].z;
    // Wrap around
    for (let j = 0; j < 3; j++) {
      if (pos[i * 3 + j] > 30) pos[i * 3 + j] = -30;
      if (pos[i * 3 + j] < -30) pos[i * 3 + j] = 30;
    }
  }
  particleGeo.attributes.position.needsUpdate = true;

  // Update connection lines (connect nearby particles)
  const lp = lineGeo.attributes.position.array;
  let lineIdx = 0;
  const maxLines = particleCount;
  for (let i = 0; i < particleCount && lineIdx < maxLines; i++) {
    for (let j = i + 1; j < particleCount && lineIdx < maxLines; j++) {
      const dx = pos[i*3] - pos[j*3];
      const dy = pos[i*3+1] - pos[j*3+1];
      const dz = pos[i*3+2] - pos[j*3+2];
      const dist = dx*dx + dy*dy + dz*dz;
      if (dist < 25) {
        lp[lineIdx*6] = pos[i*3]; lp[lineIdx*6+1] = pos[i*3+1]; lp[lineIdx*6+2] = pos[i*3+2];
        lp[lineIdx*6+3] = pos[j*3]; lp[lineIdx*6+4] = pos[j*3+1]; lp[lineIdx*6+5] = pos[j*3+2];
        lineIdx++;
      }
    }
  }
  lineGeo.attributes.position.needsUpdate = true;
  lineGeo.setDrawRange(0, lineIdx * 2);

  // Orbit cubes
  cubes.forEach((cube, i) => {
    const d = cube.userData;
    cube.position.x = Math.cos(t * d.orbitSpeed + d.orbitOffset) * d.orbitRadius;
    cube.position.z = Math.sin(t * d.orbitSpeed + d.orbitOffset) * d.orbitRadius;
    cube.position.y = d.yOffset + Math.sin(t * 0.5 + i) * 2;
    cube.rotation.x += d.rotSpeed.x;
    cube.rotation.y += d.rotSpeed.y;
  });

  // Camera follow mouse
  camera.position.x += (mouse.x * 3 - camera.position.x) * 0.02;
  camera.position.y += (-mouse.y * 3 - camera.position.y) * 0.02;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
animate(0);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
